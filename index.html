<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; frame-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co https://api.github.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Motus</title>
<script>
/* Apparence : automatique, clair ou sombre. Choix propre à cet appareil, appliqué avant l'affichage pour éviter un flash. */
const THEME_KEY = 'journal-emotions.theme';
function themeChoisi() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch { return 'auto'; } }
function appliquerTheme() {
  const c = themeChoisi(), sombre = c === 'sombre' || (c !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = sombre ? '#0F0F1C' : '#FFFFFF';
}
appliquerTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerTheme);
</script>
<style>
:root{
  --bg:#FFFFFF;--surface:#F2F2F8;--surface2:#E8E8F2;--text:#1D1B4C;--muted:#6B6A8A;
  --brand:#1D1B4C;--accent:#4F4BC9;--on-accent:#FFFFFF;--lav:#B9B6EE;--border:#E3E3EE;--seg-on:#FFFFFF;
  --vert:#3FAE82;--vert-bg:#DDF3EA;--vert-fg:#17694B;
  --jaune:#EBB033;--jaune-bg:#FCF0D2;--jaune-fg:#7A5A08;
  --rouge:#EC6A6F;--rouge-txt:#C63F46;--rouge-bg:#FBE1E2;--rouge-fg:#8E2A30;
  --sur-jour:#FFFFFF;--sur-jaune:#3A2E00;
  --shadow:0 8px 26px rgba(29,27,76,.1);
  --r:22px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0F0F1C;--surface:#1A1A2C;--surface2:#2A2A42;--text:#ECECFA;--muted:#A3A2BF;
  --brand:#ECECFA;--accent:#9591F5;--on-accent:#0F0F1C;--lav:#5F5BA8;--border:#2C2C44;--seg-on:#2F2F4A;
  --vert:#58C79B;--vert-bg:#173A2D;--vert-fg:#A6E6CB;
  --jaune:#F0BE55;--jaune-bg:#3B3116;--jaune-fg:#F6D98E;
  --rouge:#F08489;--rouge-txt:#F08489;--rouge-bg:#45222A;--rouge-fg:#F7BABD;
  --sur-jour:#0F0F1C;--sur-jaune:#0F0F1C;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
html{touch-action:pan-x pan-y;overscroll-behavior-x:none}   /* pas de zoom, et glisser sur le côté ne fait pas « page précédente » */
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/plus-jakarta-sans.woff2) format('woff2');font-weight:400 700;font-display:swap}
body{font:500 15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;word-spacing:.05em;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;color:var(--brand);line-height:1.2}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.02em}
h2{font-size:.97rem;font-weight:600}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 96px);overflow-x:clip}
.card{background:var(--surface);border-radius:var(--r);padding:15px 16px;margin:0 0 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.count{color:var(--muted);font-size:.8rem;font-weight:500}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{display:block;font-size:.84rem;font-weight:500;color:var(--muted);margin:13px 0 6px}
input[type=text],input[type=password],input[type=email],input[type=search],input[type=time],input[type=date],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:11px 12px;outline:none;font-size:16px}   /* 16px : sinon l'iPhone zoome en entrant dans le champ */
input[type=time],input[type=date]{display:block;min-width:0;max-width:100%}
/* iPhone : sans cela, les champs date et heure gardent leur largeur native et débordent de leur case */
@supports (-webkit-touch-callout:none){
  input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}
  input::-webkit-date-and-time-value{text-align:left}
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{resize:vertical;min-height:84px}
textarea[data-notes-admin]{overflow:hidden;resize:none}   /* le cadre suit la longueur du texte (ajusterHauteur) */
.mdp-champ{position:relative;display:block}
.mdp-champ input{padding-right:48px}
.oeil{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.oeil svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--border);background:var(--bg);border-radius:15px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:transparent;border-color:var(--rouge-txt);color:var(--rouge-txt)}
.btn.block{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg);font-size:1.3rem;line-height:1;display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.3}

/* En-tête du jour */
.dayhead{display:flex;align-items:center;gap:8px;margin:2px 0 11px}
/* En faisant défiler, la date du jour ou le mois reste en haut de l'écran, sous l'encoche */
.dayhead,.calhead{position:sticky;top:env(safe-area-inset-top);z-index:4;background:var(--bg);margin:-4px -20px 5px;padding:6px 20px}
.dayhead::before,.calhead::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top);background:var(--bg)}
.dayhead.colle,.calhead.colle{box-shadow:0 1px 0 var(--border)}
/* Journal : sous le mois, le choix calendrier/liste, la recherche et les filtres s'effacent en descendant et reviennent dès qu'on remonte */
/* Journal : en haut de page, le choix calendrier/liste, la recherche et les filtres défilent normalement (#enteteJ).
   Plus bas, une barre compacte (#barreJ) redescend sous le mois dès qu'on remonte : le seul choix calendrier/liste,
   et en liste un bouton qui déploie la recherche et les filtres. Elle se retire dès qu'on redescend. */
#barreJ{position:sticky;z-index:3;height:0;margin:0 -20px}
.barreJ-in{background:var(--bg);padding:6px 20px 8px;box-shadow:0 1px 0 var(--border);visibility:hidden}
.barreJ-ligne{display:flex;gap:10px;align-items:center}
.barreJ-ligne .seg{flex:1;margin:0}
.barreJ-plus{margin-top:10px}
.barreJ-plus .card{margin-bottom:0}
.faux-champ{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:11px 12px 11px 40px;color:var(--muted);font:inherit;font-size:16px}
.faux-champ svg{left:13px}
.calhead.colle.sans-trait{box-shadow:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dayhead-t{flex:1;min-width:0}
.dayhead h1{font-size:min(1.5rem,calc((100vw - 140px) / 12));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* « Dimanche 27 septembre » tient sur une ligne : l'en-tête garde la même hauteur d'un jour à l'autre */
.dayhead .eyebrow{white-space:nowrap}
.eyebrow .link{padding:0;font:inherit;font-weight:600}

/* Frise de la semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.w{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:15px;padding:7px 0;font-size:.72rem;color:var(--muted)}
.w b{font-size:.98rem;font-weight:600;color:var(--text)}
.w i{width:6px;height:6px;border-radius:50%;background:transparent}
.w.vert i{background:var(--vert)}.w.jaune i{background:var(--jaune)}.w.rouge i{background:var(--rouge)}
.w.on{background:var(--accent);color:var(--on-accent)}.w.on b{color:inherit}
.w:disabled{opacity:.45;cursor:default}

/* Ville automatique */
.withbtn{position:relative}
.withbtn input{padding-right:44px}
.geo-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--accent);display:grid;place-items:center;border-radius:10px}
.geo-btn svg{width:20px;height:20px}
.geo-st{min-height:1.2em;margin-top:4px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Export : choix de la semaine */
.weeknav{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--bg);border-radius:15px;padding:8px}
.weeknav .wk{flex:1;text-align:center;font-size:.92rem;line-height:1.35}
.card:has(#xCustom[open]) .weeknav{opacity:.4}
.custom summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;margin-top:12px}
.wd-hint{font-size:.8rem;color:var(--muted);margin-top:4px;text-transform:capitalize}

/* Notes */
.entries{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.entry{display:flex;gap:11px;width:100%;text-align:left;background:none;border:0;padding:6px 0}
.edot{flex:none;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--fc,var(--accent)) 16%,transparent);display:grid;place-items:center}
.edot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--fc,var(--accent))}
.etxt{min-width:0;display:block}
.entry .meta{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.entry .txt{display:block;font-size:.95rem;line-height:1.35}
.entry b,.preview b{color:var(--fc);font-weight:700}
.empty{color:var(--muted);margin:4px 0 0}
.note-txt{white-space:pre-wrap;overflow-wrap:anywhere}

/* Couleurs de journée */
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.colbtn{--dc:var(--vert);border:0;background:var(--bg);color:var(--muted);border-radius:14px;padding:10px 4px;font-size:.78rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.colbtn.jaune{--dc:var(--jaune)}.colbtn.rouge{--dc:var(--rouge)}
.colbtn .dot{width:14px;height:14px;border-radius:50%;background:var(--dc)}
.colbtn.on{box-shadow:inset 0 0 0 1.5px var(--dc);color:var(--text)}
.saved{font-size:.8rem;color:var(--muted);height:1.2em;margin-top:6px;text-align:right}

/* Pastilles émotions */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:color-mix(in srgb,var(--fc) 13%,transparent);color:color-mix(in srgb,var(--fc) 85%,var(--text));border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:500}
.chip.on{background:var(--fc);color:#fff;font-weight:600}
.chip.neutre{background:var(--bg);color:var(--muted)}
.chip.neutre.on{background:var(--accent);color:var(--on-accent)}
.chip.static{padding:4px 10px;font-size:.8rem}
.famgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fam{border:1.5px solid transparent;border-radius:13px;padding:9px 4px;font-weight:600;font-size:.82rem;background:color-mix(in srgb,var(--fc) 13%,transparent);color:color-mix(in srgb,var(--fc) 85%,var(--text))}
.fam.on{border-color:var(--fc)}
[data-theme=dark] .fam,[data-theme=dark] .rep h3{color:color-mix(in srgb,var(--fc) 45%,#fff)}
[data-theme=dark] .entry b,[data-theme=dark] .preview b,[data-theme=dark] .occ b{color:color-mix(in srgb,var(--fc) 45%,#fff)}
[data-theme=dark] .chip:not(.on):not(.neutre){background:color-mix(in srgb,var(--fc) 28%,transparent);color:color-mix(in srgb,var(--fc) 38%,#fff)}
[data-theme=dark] .chip.on:not(.neutre){background:color-mix(in srgb,var(--fc) 80%,#fff)}
.besoin{font-size:.85rem;font-style:italic;color:var(--muted);margin:8px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:15px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:12px;padding:7px 4px;font-size:.87rem;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--text)}
.picked{min-height:38px;padding:8px;border:1px dashed var(--border);border-radius:13px}
.preview{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:14px;padding:12px;margin-top:14px;font-size:.95rem}
.preview .k{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}

/* Calendrier */
.calhead{display:flex;align-items:center;gap:8px}
/* Le nom du mois ouvre le choix d'un autre mois. Un espace le sépare du lien « Revenir au mois en cours », pour qu'on ne
   touche pas l'un pour l'autre ; la ligne du titre est resserrée d'autant : l'en-tête garde exactement sa hauteur. */
.calhead h1{white-space:nowrap;line-height:1}
.calhead .eyebrow{margin-bottom:5px}
.titre-mois{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;line-height:1}
.titre-mois .tm{display:inline-block}
.titre-mois .tm::first-letter{text-transform:uppercase}
.titre-mois .tm-fl{width:17px;height:17px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg)}
/* Fenêtre de choix du mois : l'année, puis les douze mois ; un point sous ceux qui contiennent des notes */
.annee-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.annee-nav b{font-size:1.3rem;font-weight:600}
.mois-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mois-grille button{position:relative;border:1px solid var(--border);background:var(--bg);border-radius:13px;padding:10px 4px 6px;font:inherit;font-weight:600;color:inherit}
.mois-grille button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mois-grille button:disabled{opacity:.35}
.mois-grille button small{display:block;min-height:1.1em;margin-top:2px;font-size:.72rem;font-weight:600;color:var(--accent)}
.mois-grille button.on small{color:inherit}
.mois-cadre{position:relative;overflow:hidden;touch-action:pan-y}
/* la fenêtre s'ouvre juste sous le mois (--haut), par-dessus le reste de l'en-tête */
dialog.en-haut{margin:0 auto;top:var(--haut,0px);bottom:auto;border-radius:0 0 22px 22px;max-height:calc(100dvh - var(--haut,0px) - 12px)}
dialog.en-haut .dlg-b{padding-top:12px}
dialog.en-haut .dlg-f{padding-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cvide{aspect-ratio:1}
.cal .wd{text-align:center;font-size:.72rem;font-weight:500;color:var(--muted);padding-bottom:2px}
.cday{aspect-ratio:1;border:0;background:none;border-radius:12px;padding:0;font-weight:500;font-size:.88rem;position:relative;display:grid;place-items:center;overflow:hidden}
.cday.vert{background:color-mix(in srgb,var(--vert) 22%,transparent)}
.cday.jaune{background:color-mix(in srgb,var(--jaune) 26%,transparent)}
.cday.rouge{background:color-mix(in srgb,var(--rouge) 24%,transparent)}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.cday.today.vert{background:var(--vert);color:var(--sur-jour);box-shadow:none}
.cday.today.rouge{background:var(--rouge);color:var(--sur-jour);box-shadow:none}
.cday.today.jaune{background:var(--jaune);color:var(--sur-jaune);box-shadow:none}
.cday.future{opacity:.35}
.cday .has{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.55}
/* Coin plié : note personnelle ce jour-là, assez grand pour se voir d'un coup d'œil */
.cday .nt{position:absolute;top:0;right:0;border-style:solid;border-width:0 13px 13px 0;border-color:transparent var(--accent) transparent transparent}
.cday.today .nt{border-right-color:currentColor}
/* Filtre : la couleur du jour reste au centre, encadrée par la couleur du filtre (fin liseré pour séparer deux teintes proches) */
.cal .cday.hit{box-shadow:inset 0 0 0 2.5px var(--fc)}
.cal.filtre .cday.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}   /* à ne pas confondre avec un cadre */
.cal.filtre .cday.today:not(.hit){box-shadow:none}
.seg.two{grid-template-columns:1fr 1fr;margin:0 0 12px}
.pastille{flex:none;border-radius:99px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--accent);color:var(--on-accent)}
nav.tabs button .badge-nav{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--rouge);color:#fff;font-size:.66rem;font-weight:700;font-style:normal;line-height:17px;text-align:center}
.depot.survol{box-shadow:inset 0 0 0 2px var(--accent)}
.demande{background:var(--bg);border-radius:15px;padding:11px 13px;margin-bottom:7px}
.choix-case{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.92rem}
.choix-case em{font-style:normal;color:var(--muted)}
.champ-recherche{position:relative;margin:0 0 12px}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.champ-recherche input{padding-left:40px}
.champ-recherche svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;pointer-events:none}
/* Balayage : la page suit le doigt (transform posé par le script) ; ce qui sort de l'écran ne fait pas défiler la page en largeur (.wrap) */
/* Vue liste */
/* Liste continue du Journal : le nom de chaque mois entre deux traits */
.mois-sep{display:flex;align-items:center;gap:12px;margin:22px 2px 12px;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mois-sep::before,.mois-sep::after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--accent) 45%,var(--border))}
.mois-vide{margin:0 4px 6px;text-align:center}
.fin-liste{height:55vh}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0 0 8px;text-align:left;font-weight:600;color:var(--brand)}
.colpill{flex:none;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:600;background:var(--bg);color:var(--muted)}
.colpill.vert{background:var(--vert-bg);color:var(--vert-fg)}.colpill.jaune{background:var(--jaune-bg);color:var(--jaune-fg)}.colpill.rouge{background:var(--rouge-bg);color:var(--rouge-fg)}
.occ{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:10px 0}
.occ:first-of-type{border-top:0}
.occ .meta{font-size:.78rem;color:var(--muted);font-weight:500}
.occ .txt{margin-top:2px;font-size:.92rem}
.occ b{color:var(--fc);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:11px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.bar{display:flex;height:6px;gap:2px;margin:8px 0}
.bar div{height:100%;border-radius:3px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.stat b{font-weight:600}
.stat:last-child{border-bottom:0}

<script>
'use strict';

/* ───────────── Répertoire des émotions (Liberté pour Aimer) ───────────── */
const FAM = [
  {k:'peur', n:'Peur', b:'Besoin de sécurité & de protection', c:'#5B6BB5',
   l:['Inquiet(e)','Préoccupé(e)','Hésitant(e)','Méfiant(e)','Indécis(e)'],
   m:['Anxieux(se)','Angoissé(e)','Insécure','Craintif(ve)','Vulnérable','Tendu(e)'],
   i:['Terrorisé(e)','Paniqué(e)','Effrayé(e)','Sidéré(e)','En détresse']},
  {k:'colere', n:'Colère', b:'Besoin de limites & de respect', c:'#C2453A',
   l:['Contrarié(e)','Agacé(e)','Impatient(e)','Irrité(e)','Mécontent(e)'],
   m:['Frustré(e)','Aigri(e)','Exaspéré(e)','Plein(e) de rancœur','Offensé(e)'],
   i:['Enragé(e)','Furieux(se)','Indigné(e)','Hors de moi','Hostile']},
  {k:'tristesse', n:'Tristesse', b:'Besoin de réconfort & de soutien', c:'#3E7CA6',
   l:['Mélancolique','Nostalgique','Abattu(e)','Déçu(e)','Seul(e)'],
   m:['Découragé(e)','Désillusionné(e)','Résigné(e)','Blessé(e)'],
   i:['Désespéré(e)','Anéanti(e)','Dévasté(e)','Abandonné(e)','En deuil']},
  {k:'joie', n:'Joie', b:'Besoin de partage & de célébration', c:'#B07F12',
   l:['Serein(e)','Apaisé(e)','Soulagé(e)','Détendu(e)','En paix'],
   m:['Satisfait(e)','Enthousiaste','Fier(ère)','Confiant(e)','Stimulé(e)'],
   i:['Euphorique','Ravi(e)','Émerveillé(e)','Reconnaissant(e)','Plein(e) de gratitude']},
  {k:'degout', n:'Dégoût & rejet', b:'Besoin d’éloignement & d’alignement', c:'#5E8A49',
   l:['Gêné(e)','Réticent(e)','Mal à l’aise','Refroidi(e)'],
   m:['Écœuré(e)','Distant(e)','Plein(e) d’antipathie','Méprisant(e)'],
   i:['Révulsé(e)','Dégoûté(e)','Horrifié(e)','En rejet total']},
  {k:'surprise', n:'Surprise', b:'Besoin de réorientation & d’intégration', c:'#9B559A',
   l:['Curieux(se)','Intrigué(e)','Étonné(e)','Perplexe'],
   m:['Déconcerté(e)','Désorienté(e)','Sous le choc','Ébahi(e)'],
   i:['Sidéré(e)','Stupéfait(e)','Saisi(e)','Totalement émerveillé(e)']},
];
const FAMK = Object.fromEntries(FAM.map(f => [f.k, f]));
const INT = [['l','Légère'],['m','Modérée'],['i','Intense']];
const INTN = Object.fromEntries(INT);
const COL = ['vert','jaune','rouge'];
const COLNAME = {vert:'Vert', jaune:'Jaune', rouge:'Rouge'};
const DEF_LABELS = {vert:'Bonne journée', jaune:'Journée mitigée', rouge:'Journée difficile'};

/* ───────────── Utilitaires ───────────── */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmtLong = s => { const d = parse(s); return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtFR = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = w => w.charAt(0).toLowerCase() + w.slice(1);
const joinFr = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' et ' + a[a.length-1];
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cleanCar = e => (e.car || '').trim().replace(/[.\s]+$/, '');
const where = e => [e.ville, e.lieu].filter(Boolean).join(' · ');
const fmtDay = s => { const d = parse(s); return `${JOURS[d.getDay()].toLowerCase()} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const weekday = s => s ? JOURS[parse(s).getDay()].toLowerCase() : '';

function sentence(e) {
  const car = cleanCar(e);
  return 'Je me sens ' + joinFr(e.emos.map(x => lc(x.w))) + (car ? ' car ' + car : '') + '.';
}
function sentenceHtml(e) {
  const car = cleanCar(e);
  return 'Je me sens ' + joinFr(e.emos.map(x => `<b style="--fc:${FAMK[x.f].c}">${esc(lc(x.w))}</b>`)) + (car ? ' car ' + esc(car) : '') + '.';
}

const APP_VERSION = 32;   // même numéro que CACHE dans sw.js
const HEURES_TRAVAIL = 23;   // à chaque nouvelle version : résultat de outils/compter-heures.ps1, arrondi à l'heure
const JETONS_CONSOMMES = {total:605, cache:594, envoyes:8.9, ecrits:2.1};   // en millions, même script, même moment
const RGPD_VERSION = 3; // version de confidentialite.html ; l'augmenter redemande l'acceptation à tous les comptes
const MAIL_AIDE = {
  client:'Votre mail sert uniquement à récupérer votre compte ou à effacer vos données. Un code vous sera envoyé pour le confirmer.',
  therapeute:'Votre mail professionnel sert à récupérer votre compte, à effacer vos données et à recevoir les envois de vos clients : il leur est transmis une fois leur demande acceptée. Un code vous sera envoyé pour le confirmer.',
};
const MAIL_NOM = {client:'Mail de récupération', therapeute:'Mail professionnel'};
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ───────────── Chiffrement (AES-GCM 256, clé dérivée du code par PBKDF2) ───────────── */
let VKEY = null;                                  // journal de l'utilisateur connecté sur cet appareil
const vaultKey = id => 'journal-emotions.donnees.' + id;
const ITER = 250000;
let key = null, salt = null, data = null;

function toB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

async function deriveKey(code, saltU8, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealData(obj, k, saltU8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc.encode(JSON.stringify(obj))));
  return {app:'journal-emotions', v:1, iter:ITER, salt:toB64(saltU8), iv:toB64(iv), ct:toB64(ct)};
}
async function openVault(v, code) {
  const s = fromB64(v.salt);
  const k = await deriveKey(code, s, v.iter || ITER);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, k, fromB64(v.ct));
  return {k, s, obj: JSON.parse(dec.decode(pt))};
}

let saveTimer, savePending = Promise.resolve();
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  clearTimeout(saveTimer);
  if (!key) return savePending;
  const snapshot = data, k = key, s = salt, vk = VKEY;
  savePending = savePending.then(async () => {
    localStorage.setItem(vk, JSON.stringify(await sealData(versFichier(snapshot), k, s)));
  }).catch(err => { console.error(err); toast('Erreur d’enregistrement'); });
  return savePending;
}

/* ───────────── Données ─────────────
   Fichier « données utilisateur », chiffré, en sections. Effacer ses données ne vide que le journal et les données reçues des clients : les fiches clients restent. */
function versFichier(d) {
  const {days, backupAt, backupPlusTard, clients, ...parametres} = d;

const LOGIN_ERR = {
  identifiants: 'Identifiant ou mot de passe incorrect.',
  desactive: 'Ce compte a été désactivé par l’administrateur. Contactez l’administrateur.',
  reseau: 'Pas de connexion internet : impossible de vérifier votre compte.',

async function onLogin(e) {
  e.preventDefault();
  const id = $('#lId').value.trim().toLowerCase(), pw = $('#lPw').value, err = $('#lockErr'), btn = $('#loginBtn');
  if (!id || !pw) return err.textContent = 'Indiquez votre identifiant et votre mot de passe.';
  if (Date.now() < blockedUntil) return err.textContent = `Trop d’essais. Réessayez dans ${Math.ceil((blockedUntil - Date.now()) / 1000)} s.`;
  const fail = msg => { err.textContent = msg; btn.disabled = false; btn.textContent = 'Se connecter'; };
  btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
  try {
    await API.signIn(id, pw);
    profil = await API.rpc('ouvrir_session');
    if (!profil?.actif) { API.signOut(); profil = null; return fail(LOGIN_ERR.desactive); }
  } catch (x) {
    // hors connexion : le journal déjà présent sur cet appareil s'ouvre avec le mot de passe
    if (x.code === 'reseau' && localStorage.getItem(vaultKey(id))) { session = null; profil = null; }
    else {
      if (x.code === 'identifiants' && ++fails >= 5) blockedUntil = Date.now() + 30000 * (fails - 4);
      return fail(LOGIN_ERR[x.code] || 'Connexion impossible pour le moment. Réessayez plus tard.');
    }
  }
  fails = 0;
  try { await openJournal(id, pw); }
  catch (x) { if (x.code !== 'journal') console.error(x); API.signOut(); profil = null; fail(x.code === 'journal' ? x.message : 'Impossible d’ouvrir le journal de cet appareil.'); }
}

  catch (x) {

      pris: 'Cet identifiant est déjà utilisé : choisissez-en un autre.',

  try {
    await openJournal(f.identifiant, f.password, {role:f.role, profile:{prenom:f.prenom, nom:f.nom}, consentement:{...f.rgpd, envoye:true}});
    await choixInitiaux();

  } finally { differeMail = false; }

/* Ouvre (ou crée) le journal chiffré de ce compte sur cet appareil */
async function openJournal(id, pw, init) {
  VKEY = vaultKey(id);
  const raw = localStorage.getItem(VKEY) || (session && !init ? await reprendreJournal(id, pw) : null);
  if (raw) {
    let r;
    try { r = await openVault(JSON.parse(raw), pw); }
    catch {
      if (!session) throw apiErr('journal', 'Mot de passe incorrect.');   // hors connexion
      // mot de passe changé depuis un autre appareil : l'ancien rouvre le journal de celui-ci
      const old = await askCode('Journal de cet appareil', {label:'Ancien mot de passe', hint:'Votre mot de passe a changé depuis votre dernière connexion ici. Entrez l’ancien pour rouvrir le journal de cet appareil.'});
      if (old == null) throw apiErr('journal', 'Journal de cet appareil non ouvert.');
      try { r = await openVault(JSON.parse(raw), old); } catch { throw apiErr('journal', 'Ancien mot de passe incorrect.'); }
      r.s = crypto.getRandomValues(new Uint8Array(16)); r.k = await deriveKey(pw, r.s);
    }
    key = r.k; salt = r.s; data = defaults(r.obj);
  } else {
    salt = crypto.getRandomValues(new Uint8Array(16)); key = await deriveKey(pw, salt);
    data = defaults(init || {});
  }
  applyProfil();
  data.account ||= {identifiant:id};
  localStorage.setItem(LAST_ID, id);
  if (data.settings.autolock === -1) { await rememberKey().catch(() => {}); rememberSession(); }
  if (data.role === 'therapeute') await ensureKeys(); else await saveNow();
  navigator.storage?.persist?.();
  showApp();
  if (!await exigerRgpd()) return;
  pushProfile(); flushStats(); assurerLienCourt(); synchroCanaux(true); ensureSecours(pw).then(ok => ok && exigerMail());
}

function applyProfil() {
  if (!profil) return;
  data.role = profil.role;
  data.account = {identifiant:profil.identifiant, numero:codeU(profil.numero), est_admin:!!profil.est_admin, recup:!!data.account?.recup, cree_le:profil.cree_le || data.account?.cree_le};
  if (!data.profile.nom && !data.profile.prenom) Object.assign(data.profile, {nom:profil.nom, prenom:profil.prenom});
}

/* Récupération par e-mail : le serveur garde une clé de secours et seulement une empreinte de l'adresse.
   Cet appareil garde la clé du journal chiffrée par la clé de secours : aucun des deux, seul, n'ouvre les notes. */
const secoursKey = id => 'journal-emotions.secours.' + id;
/* Aide-mémoire pour « Mot de passe oublié » : uniquement la version masquée, lisible sans ouvrir le journal */
const indiceKey = id => 'journal-emotions.indice.' + id;
function syncIndice() {
  const k = indiceKey(data.account.identifiant);
  if (data.recupIndice) localStorage.setItem(k, data.recupIndice); else localStorage.removeItem(k);
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function passwordBits(pw, saltU8) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt:saltU8, iterations:ITER, hash:'SHA-256'}, base, 256);
}
/* Met à jour l'état de la récupération ; avec le mot de passe, recrée aussi la copie de secours de la clé */
async function ensureSecours(pw) {
  if (!session || !data) return;
  try {
    const cle = await API.rpc('ma_cle_secours');
    if (!data) return;
    const sk = secoursKey(data.account.identifiant);
    const etat = cle ? await API.rpc('ma_recuperation_etat') : null;
    if (!data) return;
    data.account.recup = etat?.confirmee ? 'confirmee' : etat?.attente ? 'attente' : false;
    data.account.recupChange = !!(etat?.confirmee && etat.attente);
    if (data.account.recup !== 'attente' && !data.account.recupChange) {

    const v = JSON.parse(localStorage.getItem(vaultKey(id))), b = JSON.parse(localStorage.getItem(secoursKey(id)));
    if (!v || !b) return false;
    const ks = await crypto.subtle.importKey('raw', fromB64(cle), 'AES-GCM', false, ['decrypt']);
    const bits = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(b.iv)}, ks, fromB64(b.ct));
    const old = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const obj = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, old, fromB64(v.ct))));

async function renommerStockage(ancien, nouveau) {

  for (const f of [secoursKey, indiceKey]) { const v = localStorage.getItem(f(ancien)); if (v != null) localStorage.setItem(f(nouveau), v); }
  VKEY = vaultKey(nouveau); data.account.identifiant = nouveau;
  await saveNow();
  const v = JSON.parse(localStorage.getItem(VKEY));
  await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, key, fromB64(v.ct));   // échoue si la copie est illisible : l'ancienne reste
  for (const k of [vaultKey(ancien), 'journal-emotions.vault.' + ancien, secoursKey(ancien), indiceKey(ancien)]) localStorage.removeItem(k);
  if (localStorage.getItem(LAST_ID) === ancien) localStorage.setItem(LAST_ID, nouveau);

/* « Rester connecté » (déconnexion automatique : Jamais) : la clé du journal, non exportable, reste dans ce
   navigateur ; le jeton de connexion au serveur est enregistré dans le journal chiffré. */
function keyDb(mode, fn) {
  return new Promise((ok, ko) => {
    const o = indexedDB.open('journal-emotions', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('cle');
    o.onerror = () => ko(o.error);
    o.onsuccess = () => {
      const t = o.result.transaction('cle', mode), r = fn(t.objectStore('cle'));
      t.oncomplete = () => { o.result.close(); ok(r.result); };
      t.onerror = t.onabort = () => { o.result.close(); ko(t.error); };
    };
  });
}
const rememberKey = () => keyDb('readwrite', s => s.put({id:data.account.identifiant, key}, 'courante'));
const forgetKey = () => keyDb('readwrite', s => s.delete('courante')).catch(() => {});
function rememberSession() {
  if (data?.settings.autolock !== -1) return;
  const t = API.token();
  if (t) { data.resume = t; save(); }
}
async function setAutolock(t) {
  const v = +t.value;
  if (v === -1 && !confirm('Rester connecté sur cet appareil ?\n\nToute personne ayant accès à ce téléphone déverrouillé pourra ouvrir votre journal sans mot de passe. À éviter sur un appareil partagé.')) {
    t.value = data.settings.autolock; return;
  }
  data.settings.autolock = v;
  try {
    if (v === -1) { await rememberKey(); rememberSession(); }
    else { await forgetKey(); delete data.resume; }
  } catch { data.settings.autolock = 1; t.value = 1; toast('Ce navigateur ne permet pas de rester connecté.'); }
  save();
}

/* Sauvegarde en un appui : le fichier chiffré est préparé immédiatement, car le menu de partage du téléphone
   doit s'ouvrir directement après l'appui. Rappel si la dernière sauvegarde date de plus de 7 jours. */
const SAUVEGARDE_JOURS = 7;
const aDesDonnees = () => Object.values(data.days).some(dayFilled) || Object.keys(data.clients).length > 0;
const joursDepuis = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);
function sauvegardeReminder() {
  if (!aDesDonnees() || data.backupPlusTard === today()) return '';
  const premier = Object.keys(data.days).filter(k => dayFilled(data.days[k])).sort()[0];
  const j = data.backupAt ? joursDepuis(data.backupAt) : premier ? joursDepuis(parse(premier)) : SAUVEGARDE_JOURS + 1;
  if (j <= SAUVEGARDE_JOURS) return '';
  return `<div class="banner sauvegarde-rappel"><span>${data.backupAt ? `Dernière sauvegarde il y a ${j} jours.` : 'Aucune sauvegarde pour l’instant.'} Sans sauvegarde, vos notes seraient perdues avec votre téléphone.</span>
    <div class="banner-actions"><button class="btn primary" data-act="backup">Sauvegarder</button><button class="link small" data-act="backupLater">Plus tard</button></div></div>`;
}
async function sauvegarder() {

  busy = true;

    if (navigator.canShare?.({files:[file]})) await navigator.share({files:[file], title:'Sauvegarde Motus'});
    else download(file, name);
  } catch (err) {

    download(file, name);

  data.backupAt = new Date().toISOString(); delete data.backupPlusTard;
  await saveNow();
  $('.sauvegarde-rappel')?.remove();
  if (view === 'set' && !src) render(true);
  toast('Sauvegarde créée. Elle s’ouvre avec votre mot de passe actuel.');
}

        <span class="edot"></span><span class="etxt">
        <span class="meta">${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</span>
        <span class="txt">${sentenceHtml(e)}</span></span>
      </${ro ? 'div' : 'button'}></li>`).join('')}</ul>`
    : ro ? '<p class="empty">Aucune émotion notée ce jour-là.</p>'
    : `<p class="empty">Rien de noté ${isT ? 'pour l’instant' : 'ce jour-là'}. Prenez un instant : où êtes-vous, que ressentez-vous ?</p>`}
    ${ro ? '' : '<button class="btn primary block" data-act="newEntry">+ Noter une émotion</button>'}
  </section>

  ${ro && ns.length ? `<section class="card">
    <div class="card-h"><h2>Notes personnelles</h2><span class="count">${ns.length}</span></div>
    <ul class="entries">${ns.map(n => `
      <li><div class="entry" style="--fc:var(--lav)"><span class="edot"></span><span class="etxt">
        <span class="meta">${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''}</span>
        <span class="txt note-txt">${esc(n.text)}</span></span></div></li>`).join('')}</ul>
  </section>` : ''}

  ${ro ? '' : `<section class="card">
    <div class="card-h"><h2>Mes notes personnelles</h2><span class="count">${ns.length}</span></div>
    ${ns.length ? `<ul class="entries">${ns.map(n => `
      <li><button class="entry" style="--fc:var(--lav)" data-act="editNote" data-id="${n.id}">
        <span class="edot"></span><span class="etxt">
        <span class="meta">${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''}</span>
        <span class="txt note-txt">${esc(n.text)}</span></span>
      </button></li>`).join('')}</ul>` : ''}
    <button class="btn block" data-act="newNote">+ Ajouter une note</button>
  </section>`}

  <section class="card">
    <h2>Synthèse de la journée</h2>
    ${fs.length ? `<p class="label">Émotions traversées</p><div class="chips">${fs.map(([f,n]) => `<span class="chip static" style="--fc:${FAMK[f].c}">${FAMK[f].n}${n > 1 ? ' ×' + n : ''}</span>`).join('')}</div>` : ''}
    ${ro ? `
    <p class="label">Couleur de la journée</p>
    ${d.color ? `<div class="colors one"><div class="colbtn ${d.color} on"><span class="dot"></span>${esc(D().labels[d.color])}</div></div>` : '<p class="empty">Pas de couleur choisie.</p>'}
    <p class="label">Synthèse</p>
    <p class="synth-ro">${d.synth?.trim() ? esc(d.synth) : '<span class="muted">Pas de synthèse ce jour-là.</span>'}</p>` : `
    <p class="label">Ma journée était…</p>
    <div class="colors">${COL.map(c => `
      <button class="colbtn ${c} ${d.color === c ? 'on' : ''}" data-act="setColor" data-c="${c}" aria-pressed="${d.color === c}">
        <span class="dot"></span>${esc(D().labels[c])}
      </button>`).join('')}</div>
    <label class="label" for="synth">En quelques mots</label>
    <textarea id="synth" rows="5" placeholder="Ce qui a marqué ma journée, ce que j’ai ressenti, ce que j’ai mis en place…">${esc(d.synth)}</textarea>
    <div class="saved" id="saved" aria-live="polite"></div>`}
  </section>`;
}

/* — Vue Calendrier — */
function vCal() {
  const first = new Date(calY, calM, 1), nDays = new Date(calY, calM + 1, 0).getDate();
  const off = (first.getDay() + 6) % 7, t = today();
  const now = new Date(), atCurrent = calY === now.getFullYear() && calM === now.getMonth();
  let cells = ['L','M','M','J','V','S','D'].map(w => `<div class="wd">${w}</div>`).join('');
  cells += '<div class="cvide"></div>'.repeat(off);
  const cnt = {vert:0, jaune:0, rouge:0}, words = {}, fams = {};
  let nEntries = 0, pastDays = 0;
  const fam = calF && FAMK[calF], notesOnly = calF === 'notes', synthOnly = calF === 'synth', filtre = fam || notesOnly || synthOnly, occ = [], occN = [], occS = [], fWords = {};
  const cadre = fam ? fam.c : 'var(--accent)';
  let fDays = 0, nNotes = 0;
  for (let i = 1; i <= nDays; i++) {
    const k = ymd(new Date(calY, calM, i)), d = D().days[k], fut = k > t, ns = dayNotes(d);
    if (!fut) pastDays++;
    nNotes += ns.length;
    if (notesOnly) ns.forEach(n => occN.push({k, n}));
    if (synthOnly && d?.synth?.trim()) occS.push(k);
    if (d?.color) cnt[d.color]++;
    let maxI = -1; // intensité la plus forte de l'émotion filtrée ce jour-là
    (d?.entries || []).forEach(e => {
      nEntries++;
      e.emos.forEach(x => { words[x.w] = (words[x.w]||0) + 1; fams[x.f] = (fams[x.f]||0) + 1; if (x.f === calF) fWords[x.w] = (fWords[x.w]||0) + 1; });
      const hit = fam ? e.emos.filter(x => x.f === calF && (!calW || x.w === calW)) : [];
      if (hit.length) { occ.push({k, e}); maxI = Math.max(maxI, ...hit.map(x => INT.findIndex(([c]) => c === x.i))); }
    });
    const hit = fam ? maxI >= 0 : notesOnly ? ns.length > 0 : synthOnly && !!d?.synth?.trim();
    if (hit) fDays++;
    const lab = (d?.color ? ', ' + esc(D().labels[d.color]) : '') + (maxI >= 0 ? `, ${fam.n} ${INT[maxI][1].toLowerCase()}` : '') + (ns.length ? ', note personnelle' : '');
    cells += `<button class="cday ${d?.color || ''} ${hit ? 'hit' : ''} ${k === t ? 'today' : ''} ${fut ? 'future' : ''}"${hit ? ` style="--fc:${cadre}"` : ''} data-act="openDay" data-k="${k}" ${fut ? 'disabled' : ''}
      aria-label="${fmtLong(k)}${lab}">${i}${!filtre && d?.entries?.length ? '<span class="has"></span>' : ''}${!filtre && ns.length ? '<span class="nt"></span>' : ''}</button>`;
  }
  cells += '<div class="cvide"></div>'.repeat(42 - off - nDays);   // toujours six semaines : la page ne bouge pas d'un mois à l'autre
  occ.sort((a, b) => (a.k + a.e.time).localeCompare(b.k + b.e.time));
  occN.sort((a, b) => (a.k + a.n.time).localeCompare(b.k + b.n.time));
  const dayName = k => `${JOURS[parse(k).getDay()]} ${parse(k).getDate()} ${MOIS[parse(k).getMonth()]}`;
  // liste continue : les émotions précises proposées par le filtre viennent de tous les mois
  if (calMode === 'list' && fam) {
    for (const w in fWords) delete fWords[w];
    for (const d of Object.values(D().days)) for (const e of d.entries || []) for (const x of e.emos) if (x.f === calF) fWords[x.w] = (fWords[x.w] || 0) + 1;
  }

  const filterCard = `
  <section class="card">
    <h2>Afficher</h2>
    <div class="chips" style="margin-top:10px">
      <button class="chip neutre ${!filtre ? 'on' : ''}" data-act="calFilter" data-f="" aria-pressed="${!filtre}">Tout</button>
      <button class="chip neutre ${notesOnly ? 'on' : ''}" data-act="calFilter" data-f="notes" aria-pressed="${notesOnly}">Notes personnelles</button>
      <button class="chip neutre ${synthOnly ? 'on' : ''}" data-act="calFilter" data-f="synth" aria-pressed="${synthOnly}">Synthèses</button>
      ${FAM.map(f => `<button class="chip ${calF === f.k ? 'on' : ''}" style="--fc:${f.c}" data-act="calFilter" data-f="${f.k}" aria-pressed="${calF === f.k}">${f.n}</button>`).join('')}
    </div>
    ${fam ? `<p class="label">Émotion précise</p><div class="chips">
      <button class="chip ${!calW ? 'on' : ''}" style="--fc:${fam.c}" data-act="calWord" data-w="" aria-pressed="${!calW}">Toutes</button>
      ${[...new Set([...Object.keys(fWords), ...(calW ? [calW] : [])])].map(w => `<button class="chip ${calW === w ? 'on' : ''}" style="--fc:${fam.c}" data-act="calWord" data-w="${esc(w)}" aria-pressed="${calW === w}">${esc(w)}${fWords[w] ? ' · ' + fWords[w] : ''}</button>`).join('')}
    </div>` : ''}
  </section>`;
  const legend = COL.map(c => `<span><i style="background:var(--${c})"></i>${esc(D().labels[c])}</span>`).join('')
    + (filtre ? `<span><i style="border:3px solid ${cadre}"></i>${esc(fam ? calW || fam.n : notesOnly ? 'Note personnelle' : 'Synthèse')}</span>`
      : '<span><i style="background:currentColor;width:4px;height:4px"></i>émotions notées</span>'
        + '<span><i style="width:0;height:0;border-radius:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--accent) transparent transparent"></i>note personnelle</span>');
  const occCard = fam ? `
  <section class="card">
    <h2>${esc(calW || fam.n)} · ${MOIS[calM]}</h2>
    <p class="small muted" style="margin:6px 0 4px">${occ.length ? `${fDays} jour${fDays > 1 ? 's' : ''} concerné${fDays > 1 ? 's' : ''} · ${occ.length} note${occ.length > 1 ? 's' : ''}` : 'Aucune note avec cette émotion ce mois-ci.'}</p>
    ${occ.map(({k, e}) => `<button class="occ" data-act="openDay" data-k="${k}">
      <div class="meta">${dayName(k)} · ${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</div>
      <div class="txt">${sentenceHtml(e)}</div>
    </button>`).join('')}
  </section>` : synthOnly ? `
  <section class="card">
    <h2>Synthèses · ${MOIS[calM]}</h2>
    <p class="small muted" style="margin:6px 0 4px">${occS.length ? `${occS.length} synthèse${occS.length > 1 ? 's' : ''}` : 'Aucune synthèse ce mois-ci.'}</p>
    ${occS.map(k => `<button class="occ" data-act="openDay" data-k="${k}">
      <div class="meta">${dayName(k)}</div>
      <div class="txt note-txt">${esc(D().days[k].synth.trim())}</div>
    </button>`).join('')}
  </section>` : `
  <section class="card">
    <h2>Notes personnelles · ${MOIS[calM]}</h2>
    <p class="small muted" style="margin:6px 0 4px">${occN.length ? `${fDays} jour${fDays > 1 ? 's' : ''} concerné${fDays > 1 ? 's' : ''} · ${occN.length} note${occN.length > 1 ? 's' : ''}` : 'Aucune note personnelle ce mois-ci.'}</p>
    ${occN.map(({k, n}) => `<button class="occ" data-act="openDay" data-k="${k}">
      <div class="meta">${dayName(k)} · ${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''}</div>
      <div class="txt note-txt">${esc(n.text)}</div>
    </button>`).join('')}
  </section>`;
  /* Vue liste : une seule liste continue, du mois en cours au plus ancien, chaque mois séparé par son nom.
     L'en-tête suit le mois affiché pendant le défilement (majEnteteListe) ; flèches et balayage mènent au mois voulu (allerAuMois). */
  function listeContinue() {
    const now = new Date(), ks = Object.keys(D().days).sort(), cree = !src && data.account?.cree_le ? ymd(new Date(data.account.cree_le)) : '';
    let premier = [ks[0], cree, ymd(new Date(calY, calM, 1))].filter(Boolean).sort()[0];
    const fin = parse(premier), mois = [];
    for (let y = now.getFullYear(), m = now.getMonth(); y > fin.getFullYear() || (y === fin.getFullYear() && m >= fin.getMonth()); m === 0 ? (m = 11, y--) : m--) mois.push([y, m]);
    return `<div id="listeNotes">${mois.map(([y, m]) => `<div class="mois-bloc" data-mois="${y}-${m}"><div class="mois-sep" data-mois="${y}-${m}"><span>${MOIS[m]} ${y}</span></div>
      ${listCards(y, m) || `<p class="small muted mois-vide">${filtre ? 'Rien pour ce filtre' : 'Rien de noté'} en ${MOIS[m]}.</p>`}</div>`).join('')}</div>`
      + '<div class="fin-liste"></div>';   // de la place en bas : le mois le plus ancien peut lui aussi remonter sous l'en-tête
  }
  function listCards(y, m) {
    const out = [];
    for (let i = new Date(y, m + 1, 0).getDate(); i >= 1; i--) {
      const k = ymd(new Date(y, m, i)), d = D().days[k];
      if (!d || k > t) continue;
      const ents = (d.entries || []).filter(e => !fam || e.emos.some(x => x.f === calF && (!calW || x.w === calW)));
      const lignes = [
        ...(notesOnly || synthOnly ? [] : ents.map(e => ({time:e.time, html:`<div class="meta">${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</div><div class="txt">${sentenceHtml(e)}</div>`}))),
        ...(fam || synthOnly ? [] : dayNotes(d).map(n => ({time:n.time, html:`<div class="meta">${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''} · Note personnelle</div><div class="txt note-txt">${esc(n.text)}</div>`}))),
      ].sort((a, b) => a.time.localeCompare(b.time));
      const synth = (!filtre || synthOnly) && d.synth?.trim();
      if (!lignes.length && !synth && (filtre || !d.color)) continue;
      out.push(`<section class="card lday">
        <button class="lhead" data-act="openDay" data-k="${k}"><span>${dayName(k)}</span><span class="colpill ${d.color || ''}">${d.color ? esc(D().labels[d.color]) : 'Sans couleur'}</span></button>
        ${lignes.map(l => `<button class="occ" data-act="openDay" data-k="${k}">${l.html}</button>`).join('')}
        ${synth ? `<button class="occ" data-act="openDay" data-k="${k}"><div class="meta">Synthèse</div><div class="txt note-txt">${esc(d.synth)}</div></button>` : ''}
      </section>`);
    }
    return out.join('');
  }
  const noted = cnt.vert + cnt.jaune + cnt.rouge;
  const topW = Object.entries(words).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const famTot = Object.values(fams).reduce((a,b) => a+b, 0);
  const famS = Object.entries(fams).sort((a,b) => b[1]-a[1]);
  const segJ = `<div class="seg two">
    <button class="${calMode === 'grid' ? 'on' : ''}" data-act="calMode" data-m="grid" aria-pressed="${calMode === 'grid'}">Calendrier</button>
    <button class="${calMode === 'list' ? 'on' : ''}" data-act="calMode" data-m="list" aria-pressed="${calMode === 'list'}">Liste</button>
  </div>`;
  return `
  ${clientBar()}${srcImportCard()}
  <div class="calhead">
    <div class="dayhead-t">
      <div class="eyebrow">${atCurrent ? 'Ce mois-ci' : `<button class="link" data-act="moisEnCours">${calMode === 'list' ? 'Revenir à aujourd’hui' : 'Revenir au mois en cours'}</button>`}</div>
      <h1><button class="titre-mois" data-act="choisirMois" aria-label="Choisir un autre mois"><span class="tm">${MOIS[calM]} ${calY}</span>${ico('ch', 'tm-fl')}</button></h1>
    </div>
    <button class="icon-btn" data-act="prevMonth" aria-label="Mois précédent">‹</button>
    <button class="icon-btn" data-act="nextMonth" aria-label="Mois suivant" ${atCurrent ? 'disabled' : ''}>›</button>
  </div>
  <div id="barreJ"><div class="barreJ-in">
    <div class="barreJ-ligne">${segJ}${calMode === 'list' ? `<button class="icon-btn" data-act="deployerEntete" aria-label="Rechercher et filtrer" aria-expanded="${entJ.deploye}">${ico('filtre', '')}</button>` : ''}</div>
    ${calMode === 'list' ? `<div class="barreJ-plus" ${entJ.deploye ? '' : 'hidden'}>
      <button class="champ-recherche faux-champ" data-act="chercherJ">${ico('loupe', '')}<span>${calQ.trim() ? esc(calQ) : 'Rechercher dans toutes les notes'}</span></button>
      ${filterCard}
    </div>` : ''}
  </div></div>
  <div id="enteteJ">
  ${segJ}
  ${calMode === 'list' ? `<div class="champ-recherche">${ico('loupe', '')}<input type="search" id="calQ" value="${esc(calQ)}" placeholder="Rechercher dans toutes les notes" aria-label="Rechercher" autocapitalize="none" enterkeyhint="search"></div>` : ''}
  <div id="filtreJ" ${calMode === 'list' && calQ.trim() ? 'hidden' : ''}>${filterCard}</div>
  </div>
  <div id="listeMois" ${calMode === 'list' && calQ.trim() ? 'hidden' : ''}>
  ${calMode === 'list' ? listeContinue() : `<section class="card" id="carteCal">
    <div class="cal ${filtre ? 'filtre' : ''}">${cells}</div>
    <div class="legend">${legend}</div>
  </section>
  ${filtre ? occCard : `<section class="card">
    <h2>Bilan du mois</h2>
    ${noted ? `<div class="bar">${COL.map(c => cnt[c] ? `<div style="width:${cnt[c]/noted*100}%;background:var(--${c})"></div>` : '').join('')}</div>` : ''}
    ${COL.map(c => `<div class="stat"><span>${esc(D().labels[c])}</span><b>${cnt[c]}</b></div>`).join('')}
    <div class="stat"><span class="muted">Jours sans couleur</span><b class="muted">${pastDays - noted}</b></div>
    <div class="stat"><span class="muted">Émotions notées</span><b class="muted">${nEntries}</b></div>
    <div class="stat"><span class="muted">Notes personnelles</span><b class="muted">${nNotes}</b></div>
  </section>
  ${famS.length ? `<section class="card">
    <h2>Émotions du mois</h2>
    <div class="bar">${famS.map(([f,n]) => `<div title="${FAMK[f].n}" style="width:${n/famTot*100}%;background:${FAMK[f].c}"></div>`).join('')}</div>
    <div class="chips">${famS.map(([f,n]) => `<span class="chip static" style="--fc:${FAMK[f].c}">${FAMK[f].n} · ${Math.round(n/famTot*100)} %</span>`).join('')}</div>
    <p class="label">Les plus fréquentes</p>
    ${topW.map(([w,n]) => `<div class="stat"><span>${esc(w)}</span><b>${n}</b></div>`).join('')}
  </section>` : ''}`}`}</div>
  ${calMode === 'list' ? `<div id="resRech">${calQ.trim() ? resultatsRecherche(calQ) : ''}</div>` : ''}
  ${srcCard()}`;
}

/* Recherche par mot, dans tous les mois : émotions, raisons, lieux, notes personnelles et synthèses, sans tenir compte des accents ni des majuscules */
const sansAccent = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function resultatsRecherche(q) {
  const m = sansAccent(q.trim()), contient = s => sansAccent(s).includes(m), t = today();
  let n = 0;
  const cartes = Object.keys(D().days).filter(k => k <= t).sort().reverse().map(k => {
    const d = D().days[k];
    const lignes = [
      ...(d.entries || []).filter(e => contient(`${sentence(e)} ${where(e)} ${e.emos.map(x => FAMK[x.f].n).join(' ')}`))
        .map(e => ({time:e.time, html:`<div class="meta">${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</div><div class="txt">${sentenceHtml(e)}</div>`})),
      ...(src ? [] : dayNotes(d).filter(x => contient(`${x.text} ${where(x)}`))
        .map(x => ({time:x.time, html:`<div class="meta">${esc(x.time)}${where(x) ? ' · ' + esc(where(x)) : ''} · Note personnelle</div><div class="txt note-txt">${esc(x.text)}</div>`}))),
    ].sort((a, b) => a.time.localeCompare(b.time));
    const synth = d.synth?.trim() && contient(d.synth);
    if (!lignes.length && !synth) return '';
    n += lignes.length + (synth ? 1 : 0);
    return `<section class="card lday">
      <button class="lhead" data-act="openDay" data-k="${k}"><span>${JOURS[parse(k).getDay()]} ${fmtLong(k)}</span><span class="colpill ${d.color || ''}">${d.color ? esc(D().labels[d.color]) : 'Sans couleur'}</span></button>
      ${lignes.map(l => `<button class="occ" data-act="openDay" data-k="${k}">${l.html}</button>`).join('')}
      ${synth ? `<button class="occ" data-act="openDay" data-k="${k}"><div class="meta">Synthèse</div><div class="txt note-txt">${esc(d.synth)}</div></button>` : ''}
    </section>`;
  }).join('');
  return cartes ? `<p class="small muted" style="margin:0 2px 10px">${n} résultat${n > 1 ? 's' : ''} pour « ${esc(q.trim())} »</p>${cartes}`
    : `<section class="card"><p class="empty">Aucun résultat pour « ${esc(q.trim())} ».</p></section>`;
}

/* — Vue Répertoire — avec une recherche, sans tenir compte des accents ni des majuscules */
let repQ = '';
function vRep() {
  return `
  <div style="margin:4px 0 16px"><div class="eyebrow">Identifier et nommer mon état intérieur</div><h1>Le répertoire des émotions</h1></div>
  <section class="card key">
    <h2>Clef de communication émotionnelle</h2>
    <p style="margin:8px 0 0">« Je me sens <i>[adjectif précis]</i> parce que <i>[explication rationnelle]</i>. »</p>
  </section>
  <div class="champ-recherche">${ico('loupe', '')}<input type="search" id="repQ" value="${esc(repQ)}" placeholder="Rechercher une émotion" aria-label="Rechercher une émotion" autocapitalize="none" enterkeyhint="search"></div>
  <div id="repListe">${listeRepertoire()}</div>
  <p class="small muted" style="text-align:center">Source : Liberté pour Aimer — libertepouraimer.com</p>`;
}
function listeRepertoire() {
  const q = sansAccent(repQ.trim());
  // les mots trouvés sont surlignés ; une lettre accentuée compte pour une seule lettre, les positions se correspondent
  const marque = w => { const i = q ? sansAccent(w).indexOf(q) : -1; return i < 0 ? esc(w) : `${esc(w.slice(0, i))}<mark>${esc(w.slice(i, i + q.length))}</mark>${esc(w.slice(i + q.length))}`; };
  const blocs = FAM.map((f, n) => {
    const tous = INT.map(([k, name]) => [name, f[k]]);
    const trouves = q ? tous.map(([name, ws]) => [name, ws.filter(w => sansAccent(w).includes(q))]).filter(([, ws]) => ws.length) : tous;
    if (q && !trouves.length && !sansAccent(f.n).includes(q)) return '';
    return `<section class="card rep" style="--fc:${f.c}">
    <h3>${n+1}. ${f.n}</h3>
    <div class="besoin">« Je me sens… » — ${f.b}</div>
    ${(trouves.length ? trouves : tous).map(([name, ws]) => `<p class="lvl"><b>${name}</b>${ws.map(marque).join(', ')}</p>`).join('')}
  </section>`;
  }).join('');
  return blocs || `<section class="card"><p class="empty">Aucune émotion ne correspond à « ${esc(repQ.trim())} ».</p></section>`;
}

/* Semaines du lundi au dimanche, de la création du compte à aujourd'hui, avec la date de leur envoi.
   Les périodes choisies à la main peuvent ne couvrir qu'une partie d'une semaine : on compte jour par jour. */
function listeSemaines() {
  const t = today(), couvert = {};   // jour → date d'envoi la plus récente
  for (const [from, s] of Object.entries(data.sent)) for (let k = from; k <= s.to; k = addDays(k, 1)) if (!couvert[k] || s.at > couvert[k]) couvert[k] = s.at;
  const premier = Object.keys(data.days).sort()[0], cree = data.account?.cree_le ? ymd(new Date(data.account.cree_le)) : t;
  const debut = premier && premier < cree ? premier : cree, court = k => fmtFR(k).slice(0, k.slice(0, 4) === t.slice(0, 4) ? 5 : 10);
  const lignes = [];
  for (let lun = mondayOf(t); lun >= mondayOf(debut); lun = addDays(lun, -7)) {
    const dim = addDays(lun, 6), jours = [];
    for (let k = lun; k <= dim && k <= t; k = addDays(k, 1)) jours.push(k);
    const faits = jours.filter(k => couvert[k]), dernier = faits.map(k => couvert[k]).sort().pop();
    const etat = !faits.length ? '<span class="muted">Non envoyée</span>'
      : faits.length === jours.length ? `Envoyée ${sentAt(dernier)}`
      : `En partie (${faits.length} jour${faits.length > 1 ? 's' : ''} sur ${jours.length}), ${sentAt(dernier)}`;
    lignes.push(`<button class="stat" data-act="choisirSemaine" data-k="${lun}"><span>Du ${court(lun)} au ${court(dim)}${dim > t ? '<br><span class="small muted">en cours</span>' : ''}</span><b class="small">${etat}</b></button>`);
  }
  return lignes.join('');
}

/* ───────────── Importer des notes depuis un texte (.txt ou texte collé) ─────────────
   Chaque note commence par une ligne qui donne sa date, souvent avec l'heure et le lieu :
   « Lundi 26 octobre 2026, 8h40 — Lyon », « 26/10/2026 18:15, au bureau », « 2026-10-31 16:00 (Annecy) »,
   « Mardi 27 octobre à 21h » (année déduite), « 1er novembre, 10h ». Une ligne qui ne contient qu'une heure (« 22h10 »,
   « 12h30 Lieu : restaurant ») ouvre une nouvelle note le même jour. Les lignes suivantes forment le texte de la note.
   Le lieu est une ville s'il figure dans la liste des communes, sinon un lieu (« bureau », « chez mes parents »). */
// début de ligne toléré : puces, titres, « Le », jour de la semaine en entier ou abrégé (« jeu. »)
const RE_DEBUT = '[\\s#*•>_-]*(?:le\\s+)?(?:(?:lun|mar|mer|jeu|ven|sam|dim)[a-zé]*\\.?,?\\s+)?(?:le\\s+)?';
const RE_MOIS = '(janv(?:ier)?|f[ée]vr?(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|ao[uû]t|sept?(?:embre)?|oct(?:obre)?|nov(?:embre)?|d[ée]c(?:embre)?)\\.?';
const MOIS_TXT = [['janv',0],['jan',0],['fev',1],['mars',2],['avr',3],['mai',4],['juin',5],['juil',6],['aou',7],['sep',8],['oct',9],['nov',10],['dec',11]];
const RE_HEURE = '(?:à|a|vers|@)?\\s*(\\d{1,2})\\s*[hH:]\\s*(\\d{2})?(?!\\d)';
const RE_DATES = [
  [new RegExp(`^${RE_DEBUT}(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})(?!\\d)`, 'i'), m => [+m[1], +m[2] - 1, +m[3]]],
  [new RegExp(`^${RE_DEBUT}(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{4}|\\d{2})(?!\\d)`, 'i'), m => [m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]]],
  [new RegExp(`^${RE_DEBUT}(\\d{1,2})(?:er)?\\s+${RE_MOIS}(?:\\s+(\\d{4}))?(?![\\p{L}\\d])`, 'iu'), m => [m[3] ? +m[3] : null, MOIS_TXT.find(([p]) => sansAccent(m[2]).startsWith(p))[1], +m[1]]],
  // « 30/10 » sans année : seulement suivi d'une heure, d'un séparateur ou de rien (« 1/2 litre » reste du texte)
  [new RegExp(`^${RE_DEBUT}(\\d{1,2})[/.](\\d{1,2})(?=\\s*$|\\s*[,;:@–—-]|\\s+${RE_HEURE})`, 'i'), m => [null, +m[2] - 1, +m[1]]],
];
const heureTxt = (h, mn = '0') => +h < 24 && +mn < 60 ? `${pad(+h)}:${pad(+mn)}` : '';
/* Ce qui suit la date et l'heure : la ville, un lieu, ou déjà le texte de la note.
   « à Paris », « (Annecy) », « Lieu : bureau », « Paris, au café », « à Lyon : journée difficile », « à Paris Journée difficile » */
function lieuTxt(reste, estVille) {
  const brut = reste.replace(/^[\s,;:–—@-]+/, '').trim();
  let s = brut.replace(/^\((.+)\)$/, '$1').replace(/^lieu\s*:\s*/i, '').trim(), texte = '';
  if (!s) return {};
  const deux = s.match(/^([^:.!?]{1,60}?)\s*:\s+(.+)$/);   // le lieu, puis le texte après deux-points
  if (deux) { s = deux[1].trim(); texte = deux[2].trim(); }
  if (s.length > 60 || /[.!?…]$|[.!?]\s/.test(s)) return {texte:brut};   // une phrase : c'est déjà le texte de la note
  const parties = s.split(/\s*[,;–—]\s*|\s+-\s+/).map(p => p.replace(/^(?:à|a|@)\s+/i, '').trim()).filter(Boolean);
  let iv = parties.findIndex(estVille), ville = iv >= 0 ? parties[iv] : '';
  if (!ville && parties.length === 1 && /^(?:à|a|@)\s/i.test(s)) {   // « à Paris Journée difficile » : la ville, puis le texte
    const mots = parties[0].split(/\s+/);
    for (let n = Math.min(4, mots.length - 1); n >= 1 && !ville; n--) if (estVille(mots.slice(0, n).join(' '))) {
      ville = mots.slice(0, n).join(' '); texte = [mots.slice(n).join(' '), texte].filter(Boolean).join(' '); parties.length = 0;
    }
  }
  const lieu = parties.filter((_, i) => i !== iv).join(', ').replace(/^(?:au|aux|à la|à)\s+/i, '').replace(/^à l['’]\s*/i, '');
  return {ville, lieu, texte};
}
function lireNotesTexte(texte, estVille) {
  const notes = [], t = today();
  let n = null, annee = null, ignore = 0, sansHeure = 0;
  const finir = () => {
    if (!n) return;
    n.text = n.lignes.join('\n').replace(/\n{3,}/g, '\n\n').trim(); delete n.lignes;
    if (n.text) { if (!n.time) { n.time = '12:00'; sansHeure++; } notes.push(n); }
    n = null;
  };
  for (const ligne of String(texte).replace(/\r\n?/g, '\n').split('\n')) {
    let m, ymj = null;
    for (const [re, f] of RE_DATES) if ((m = ligne.match(re))) { ymj = f(m); break; }
    if (ymj) {
      let [y, mo, j] = ymj;
      if (y == null) { y = annee ?? +t.slice(0, 4); if (ymd(new Date(y, mo, j)) > t) y--; }   // année absente : celle des notes précédentes
      const dt = new Date(y, mo, j);
      if (dt.getMonth() === mo && dt.getDate() === j) {
        finir(); annee = y;
        let reste = ligne.slice(m[0].length), time = '';
        const h = reste.match(new RegExp(`^[\\s,;:–—@-]*${RE_HEURE}`, 'i'));
        if (h && (time = heureTxt(h[1], h[2]))) reste = reste.slice(h[0].length);
        const l = lieuTxt(reste, estVille);
        n = {k:ymd(dt), time, ville:l.ville || '', lieu:l.lieu || '', lignes:l.texte ? [l.texte] : []};
        continue;
      }
    }
    // une heure seule (éventuellement suivie du lieu) : nouvelle note le même jour
    const h = n && ligne.match(new RegExp(`^[\\s•*-]*${RE_HEURE}(.*)$`, 'i'));
    if (h && heureTxt(h[1], h[2]) && /^\s*$|^\s*(?:[,;:–—(@-]|lieu\b|à\s|a\s|au\s|chez\s)/i.test(h[3])) {
      const l = lieuTxt(h[3], estVille);
      if (n.time || n.lignes.join('').trim()) { const k = n.k; finir(); n = {k, time:'', ville:'', lieu:'', lignes:[]}; }
      Object.assign(n, {time:heureTxt(h[1], h[2]), ville:l.ville || n.ville, lieu:l.lieu || n.lieu});
      if (l.texte) n.lignes.push(l.texte);
      continue;
    }
    if (n) n.lignes.push(ligne); else if (ligne.trim()) ignore++;
  }
  finir();
  return {notes, ignore, sansHeure};
}

      ${r.notes.length > 40 ? `<p class="small muted">… et ${r.notes.length - 40} autre${s(r.notes.length - 40)}.</p>` : ''}
      ${r.sansHeure ? `<p class="small muted">${r.sansHeure} note${s(r.sansHeure)} sans heure : placée${s(r.sansHeure)} à 12:00.</p>` : ''}

  $('#txNon').onclick = () => D.close();

/* ───────────── Lien client ↔ thérapeute (sans serveur) ─────────────
   Le thérapeute possède une paire de clés ECDH P-256 ; sa clé publique circule dans le lien d'invitation.
   Chaque envoi du client est chiffré avec une clé éphémère : seul ce thérapeute peut le déchiffrer. */
const ECDH = {name:'ECDH', namedCurve:'P-256'};
const THERA_TYPES = ['Psychologue','Psychiatre','Psychothérapeute','Thérapie brève','Gestalt-thérapie','TCC','Hypnothérapeute','Sophrologue','Autre'];
const rid = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');
const b64url = s => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); return s + '='.repeat((4 - s.length % 4) % 4); };
const lastOf = a => a[a.length - 1];

async function fingerprint(pkB64) {
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', fromB64(pkB64)))].slice(0, 4);
  const x = h.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  return x.slice(0, 4) + '-' + x.slice(4);
}
async function ensureKeys() {
  if (data.keys) return;
  const kp = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
  const pub = toB64(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)));
  data.keys = {pub, priv: await crypto.subtle.exportKey('jwk', kp.privateKey), fp: await fingerprint(pub)};
  await saveNow();
}
async function sharedKey(priv, pub, usage) {
  const bits = await crypto.subtle.deriveBits({name:'ECDH', public:pub}, priv, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:enc.encode('journal-emotions'), info:enc.encode('envoi-v1')}, hk, {name:'AES-GCM', length:256}, false, [usage]);
}
async function sealFor(th, obj) {
  const pub = await crypto.subtle.importKey('raw', fromB64(th.pk), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
  const k = await sharedKey(eph.privateKey, pub, 'encrypt'), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc.encode(JSON.stringify(obj))));
  const epk = toB64(new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey)));
  return {app:'journal-emotions', type:'envoi', v:1, to:th.fp, epk, iv:toB64(iv), ct:toB64(ct)};
}
async function openEnvoi(pkg) {
  const priv = await crypto.subtle.importKey('jwk', data.keys.priv, ECDH, false, ['deriveBits']);
  const epk = await crypto.subtle.importKey('raw', fromB64(pkg.epk), ECDH, false, []);
  const k = await sharedKey(priv, epk, 'decrypt');
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(pkg.iv)}, k, fromB64(pkg.ct))));
}

/* — Invitation : clé publique, nom et type de thérapie, dans la partie « # » du lien (jamais envoyée à un serveur).
   Le lien peut circuler : les coordonnées n'arrivent qu'aux clients acceptés, par le canal. — */
function inviteCode() {
  const p = data.profile, t = data.thera;
  const o = {v:1, pk:data.keys.pub, nom:p.nom, prenom:p.prenom, type:t.type};
  return b64url(toB64(enc.encode(JSON.stringify(o))));
}
const inviteLink = () => `${location.origin}${location.pathname}#${data.invCode ? 'i=' + data.invCode : 'inv=' + inviteCode()}`;
const refreshInvite = () => { const f = $('#invField'); if (f && data.keys) f.value = inviteLink(); };
/* Lien court : le serveur garde la clé publique et un code de 30 caractères. Sans réponse du serveur, le lien long reste valable. */
const CODE_COURT = /(?:#i=|^)([0-9a-f]{30})$/i;
async function assurerLienCourt() {
  if (!session || !data?.keys || data.role !== 'therapeute') return;
  try {
    const c = await API.rpc('mon_lien_invitation', {p_pk:data.keys.pub});
    if (c && data && c !== data.invCode) { data.invCode = c; save(); refreshInvite(); }
  } catch {}
}
async function readInvite(text) {
  const s = String(text).trim(), court = s.match(CODE_COURT);
  let o;
  if (court) o = await API.rpcAnon('lire_invitation', {p_code:court[1]});
  else {
    const m = s.match(/(?:#inv=)?([A-Za-z0-9_-]{40,})\s*$/);
    if (!m) throw new Error('format');
    o = JSON.parse(dec.decode(fromB64(unb64url(m[1]))));
  }
  if (o?.v !== 1 || !o.pk) throw new Error('format');
  await crypto.subtle.importKey('raw', fromB64(o.pk), ECDH, false, []); // clé valide ?
  // les coordonnées d'un ancien lien ou d'un serveur pas encore mis à jour sont ignorées : elles arriveront après acceptation
  return {v:1, pk:o.pk, fp:await fingerprint(o.pk), prenom:o.prenom || '', nom:o.nom || '', type:o.type || ''};
}
async function offerInvite(text) {
  let o;
  try { o = await readInvite(text); } catch (x) { return toast(x.code === 'reseau' ? 'Connexion internet nécessaire pour lire cette invitation.' : 'Lien d’invitation non reconnu.'); }
  if (data.role === 'therapeute') return toast('Ce lien est destiné à vos clients.');
  const who = nomDe(o) || 'ce thérapeute', old = data.therapist;
  if (old?.fp === o.fp && old.canal) return toast(old.accepte ? `${who} est déjà votre thérapeute` : `Votre demande attend déjà l’acceptation de ${who}`);
  if (!await consentirLien(o, old?.fp === o.fp ? null : old)) return;
  if (old?.canal && old.fp !== o.fp && !await rompreCanal(old.canal, 'client')) data.ruptureAEnvoyer = old.canal;
  data.therapist = {...o, addedAt:new Date().toISOString(), canal:hexDe(crypto.getRandomValues(new Uint8Array(32))), enAttente:true};
  delete data.ruptureRecue;
  await saveNow(); await synchroCanaux(true); render(); toast(`Demande envoyée : ${who} doit l’accepter`);
}

}

/* — Client : carte « Mon thérapeute », envoi de la semaine, rappel — */
/* Retirer le thérapeute : un code affiché à recopier évite une erreur de manipulation */
/* ───────────── Lien client ↔ thérapeute : le canal ─────────────
   À la liaison, l'app du client crée un secret qu'elle remet au thérapeute, chiffré pour lui seul. Les deux apps échangent ensuite
   leurs coordonnées et l'état du lien dans un canal du serveur, chiffré avec ce secret et rangé sous un identifiant qui en dérive.
   Le journal n'y passe jamais (il voyage par mail), et le serveur ne sait pas quel client est lié à quel thérapeute :
   le client n'y accède pas avec son compte. */
const hexDe = u8 => [...new Uint8Array(u8)].map(b => b.toString(16).padStart(2, '0')).join('');
const sha256hex = async s => hexDe(await crypto.subtle.digest('SHA-256', enc.encode(s)));
const idCanal = S => sha256hex('motus-canal|' + S), jetonCanal = S => sha256hex('motus-ecrire|' + S);
const cleCanal = async S => crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', enc.encode('motus-cle|' + S)), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function chiffrerCanal(S, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await cleCanal(S), enc.encode(JSON.stringify(obj))));
  return JSON.stringify({iv:toB64(iv), ct:toB64(ct)});
}
async function dechiffrerCanal(S, txt) {
  const o = JSON.parse(txt);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(o.iv)}, await cleCanal(S), fromB64(o.ct))));
}
/* Ce que chacun montre à l'autre : jamais l'identifiant de connexion */
const ficheClient = () => ({prenom:data.profile.prenom, nom:data.profile.nom, numero:data.account?.numero || '', uid:data.uid});
const ficheTherapeute = () => ({prenom:data.profile.prenom, nom:data.profile.nom, numero:data.account?.numero || '', type:data.thera.type, tel:data.thera.tel, email:data.thera.email, adresse:data.thera.adresse});
const nomDe = o => `${o?.prenom || ''} ${o?.nom || ''}`.trim();

let synchroEnCours = false, derniereSynchro = 0, relancer = false, synchroTimer;
async function synchroCanaux(force) {
  if (!data) return;
  if (synchroEnCours) { if (force) relancer = true; return; }   // une demande arrivée pendant la synchro n'est pas perdue
  if (!force && Date.now() - derniereSynchro < 60000) return;
  synchroEnCours = true; derniereSynchro = Date.now();
  let change = false;
  try { change = data.role === 'therapeute' ? await synchroTherapeute() : await synchroClient(); }

/* Thérapeute : fichiers déposés en vrac, chacun rangé dans la fiche de son client */

    try { o = await openEnvoi(pkg); } catch { refus.push(`${f.name} : fichier abîmé`); continue; }
    if (o.type === 'liaison') { liaisons.push(fullName(lierClient(o))); continue; }
    const c = ficheDe(o.client || {}, cibleId);
    if (c.statut === 'ancien') { refus.push(`${f.name} : ${fullName(c)} n’est plus votre client`); continue; }
    integrer(c, o);
    ranges[c.id] = (ranges[c.id] || 0) + 1;
  }
  await saveNow();
  montrerImport(fichiers.length, ranges, liaisons, refus);   // avant l'affichage : une autre fenêtre attendra qu'on ferme celle-ci
  if (cibleId && Object.keys(ranges).length === 1 && ranges[cibleId]) openClient(cibleId);

  renderNav(); markTabs();

function sentStatus() {
  const same = data.sent[xStart];

  const l = lastSent();
  return l ? `Dernier envoi : du ${fmtFR(l[0]).slice(0, 5)} au ${fmtFR(l[1].to).slice(0, 5)}, ${sentAt(l[1].at)}` : 'Aucun envoi pour l’instant.';

async function sendWeek() {
  const x = exportRange(); if (!x) return;
  const th = data.therapist, p = data.profile;
  if (!p.prenom.trim() && !p.nom.trim()) return toast('Indiquez d’abord votre nom dans « Informations personnelles ».');
  if (th.canal && !th.accepte) return toast(`${th.prenom || 'Votre thérapeute'} n’a pas encore accepté votre demande : vous pourrez lui envoyer vos données ensuite.`);
  if (!data.settings.partageChoisi && !await choisirPartage()) return;   // au premier envoi
  const days = {};
  for (let k = x.from; k <= x.to; k = addDays(k, 1)) if (aEnvoyer(data.days[k])) days[k] = aTransmettre(data.days[k]);
  if (!Object.keys(days).length && !confirm('Aucune note sur cette période. Envoyer quand même ?')) return;
  const pkg = await sealFor(th, {client:{id:data.uid, nom:p.nom, prenom:p.prenom, numero:data.account?.numero || ''}, from:x.from, to:x.to, sentAt:new Date().toISOString(), labels:data.labels, days});
  const name = `motus-envoi_${x.from}.json`;
  envoyerParMail({file:new File([JSON.stringify(pkg)], name, {type:'application/json'}), from:x.from, to:x.to, chiffre:true, fait:() => {
    data.sent[x.from] = {to:x.to, at:new Date().toISOString(), dest:nomDe(th)}; countStat('envois');
    const st = $('#sentSt'); if (st) st.textContent = sentStatus();

}
/* Mail prérempli : seulement la période et le nom, jamais le contenu des notes */
function mailEnvoi(from, to, chiffre) {
  const p = data.profile, periode = `du ${fmtFR(from)} au ${fmtFR(to)}`, signe = `${p.prenom} ${p.nom}`.trim();
  return {

    corps:`Bonjour,\n\nVous trouverez en pièce jointe mon ${chiffre ? 'fichier Motus' : 'tableau Excel Motus'} pour la période ${periode}.${chiffre ? ' Il est chiffré : il s’ouvre dans Motus, depuis ma fiche (Importer un fichier reçu).' : ''}\n\nBien cordialement,\n${signe}`,
  };
}
const lienMail = (a, {objet, corps}) => `mailto:${encodeURIComponent(a || '').replace(/%40/g, '@')}?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(corps.replace(/\n/g, '\r\n'))}`;
/* Dans l'ordre : joindre le fichier, puis le destinataire, puis le texte. Le menu de partage joint le fichier et le texte, mais aucune app web ne peut y
   indiquer de destinataire : son adresse est copiée pour être collée. Sans menu de partage (PC), le fichier est téléchargé et la messagerie s'ouvre préremplie. */
async function envoyerParMail({file, from, to, chiffre, fait}) {
  const a = data.therapist?.email || '', mail = mailEnvoi(from, to, chiffre);
  if (navigator.canShare?.({files:[file]})) {
    if (a) navigator.clipboard?.writeText(a).catch(() => {});
    busy = true;
    try {
      // la messagerie de l'iPhone prend la première ligne du texte comme objet
      await navigator.share({files:[file], title:mail.objet, text:`${mail.objet}\n\n${mail.corps}`});
      fait?.();
      return toast(a ? `Pensez à coller l’adresse de votre thérapeute : ${a}` : 'Fichier prêt à envoyer');
    } catch (err) {
      if (err.name === 'AbortError') return;
    } finally { setTimeout(() => busy = false, 1500); }
  }
  download(file, file.name); fait?.();
  location.href = lienMail(a, mail);
  toast('Joignez au mail le fichier téléchargé.');
}
const aideEnvoi = a => navigator.canShare
  ? `Choisissez votre messagerie : le fichier est joint et le texte prérempli.${a ? ' L’adresse de votre thérapeute est copiée : collez-la dans « À ».' : ''}`
  : 'Le fichier se télécharge et votre messagerie s’ouvre, préremplie : joignez-y le fichier.';
/* Rappel si rien n'a été envoyé depuis 7 jours (ou depuis l'ajout du thérapeute) et qu'il y a des notes non envoyées */
const attenteAcceptation = th => !!(th?.canal && !th.accepte);
function sendReminder() {
  const th = data.therapist;

  if (attenteAcceptation(th)) return `<div class="banner attente">${ico('sablier', 'bi')}<span><b>Demande envoyée à ${esc(nomDe(th) || 'votre thérapeute')}</b><br>En attente de son acceptation. Vous pourrez ensuite lui envoyer vos données.</span>

  const l = lastSent(), ref = l ? l[1].at : data.therapist.addedAt;
  const since = Math.floor((Date.now() - new Date(ref)) / 864e5);
  const coveredTo = Object.values(data.sent).reduce((m, s) => s.to > m ? s.to : m, '');
  if (since < 7 || !Object.keys(data.days).some(k => k > coveredTo && k <= today() && dayUsed(data.days[k]))) return '';
  const who = esc(data.therapist.prenom || 'votre thérapeute');
  return `<div class="banner"><span>${l ? `Votre dernier envoi à ${who} date d’il y a ${since} jours.` : `Vous n’avez encore rien envoyé à ${who}.`}</span>

}

}
