<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://*.supabase.co https://api.github.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F9F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Motus</title>
<style>
:root{
  --bg:#F9F6F0;--surface:#FFFFFF;--surface2:#F3ECE2;--text:#3A2E26;--muted:#85766A;
  --brand:#8C5E3C;--accent:#C27B42;--lav:#C3B2D6;--border:#E7DCCD;
  --vert:#3FA35B;--vert-bg:#D4EDDA;--vert-fg:#155724;
  --jaune:#E3B21F;--jaune-bg:#FFF3CD;--jaune-fg:#856404;
  --rouge:#D9534F;--rouge-bg:#F8D7DA;--rouge-fg:#721C24;
  --shadow:0 1px 2px rgba(58,46,38,.06),0 4px 14px rgba(58,46,38,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1E1915;--surface:#2A231D;--surface2:#342B24;--text:#F1E8DE;--muted:#B3A393;
  --brand:#E3AC7E;--accent:#D98E52;--lav:#9F8CB8;--border:#43382E;
  --vert-bg:#1F3A27;--vert-fg:#A6DDB3;--jaune-bg:#3D3418;--jaune-fg:#F1D27A;--rouge-bg:#45232A;--rouge-fg:#F2B1B8;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;color:var(--brand);line-height:1.2}
h1{font-size:1.35rem}
h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.count{background:var(--surface2);color:var(--muted);border-radius:99px;padding:1px 9px;font-size:.8rem;font-weight:700}
.eyebrow{font-size:.78rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=password],input[type=email],input[type=search],input[type=time],input[type=date],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 12px;outline:none}
input[type=time],input[type=date]{display:block;min-width:0;max-width:100%}
/* iPhone : sans cela, les champs date et heure gardent leur largeur native et débordent de leur case */
@supports (-webkit-touch-callout:none){
  input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}
  input::-webkit-date-and-time-value{text-align:left}
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:84px}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;border-color:var(--rouge);color:var(--rouge)}
.btn.block{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:1.5rem;line-height:1;display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.3}

/* En-tête du jour */
.dayhead{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.dayhead-t{flex:1;text-align:center;min-width:0}
.dayhead h1{font-size:1.2rem}

/* Ville automatique */
.withbtn{position:relative}
.withbtn input{padding-right:44px}
.geo-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--accent);display:grid;place-items:center;border-radius:10px}
.geo-btn svg{width:20px;height:20px}
.geo-st{min-height:1.2em;margin-top:4px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Export : choix de la semaine */
.weeknav{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--surface2);border-radius:14px;padding:8px}
.weeknav .wk{flex:1;text-align:center;font-size:.92rem;line-height:1.35}
.card:has(#xCustom[open]) .weeknav{opacity:.4}
.custom summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.88rem;margin-top:12px}
.wd-hint{font-size:.8rem;color:var(--muted);margin-top:4px;text-transform:capitalize}

/* Notes */
.entries{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.entry{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-left:5px solid var(--fc,var(--accent));border-radius:12px;padding:10px 12px}
.entry .meta{font-size:.8rem;color:var(--muted);font-weight:700}
.entry p{margin:3px 0 0}
.entry b,.preview b{color:var(--fc)}
.empty{color:var(--muted);margin:4px 0 0}
.note-txt{white-space:pre-wrap;overflow-wrap:anywhere}

/* Couleurs de journée */
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colbtn{border:2px solid transparent;border-radius:12px;padding:10px 6px;font-size:.82rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.colbtn .dot{width:26px;height:26px;border-radius:50%}
.colbtn.vert{background:var(--vert-bg);color:var(--vert-fg)}.colbtn.vert .dot{background:var(--vert)}
.colbtn.jaune{background:var(--jaune-bg);color:var(--jaune-fg)}.colbtn.jaune .dot{background:var(--jaune)}
.colbtn.rouge{background:var(--rouge-bg);color:var(--rouge-fg)}.colbtn.rouge .dot{background:var(--rouge)}
.colbtn.on{border-color:currentColor}
.colbtn.on .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor}
.saved{font-size:.8rem;color:var(--muted);height:1.2em;margin-top:6px;text-align:right}

/* Pastilles émotions */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);background:color-mix(in srgb,var(--fc) 10%,var(--surface));color:var(--text);border-radius:99px;padding:7px 12px;font-size:.9rem}
.chip.on{background:var(--fc);border-color:var(--fc);color:#fff;font-weight:700}
.chip.static{padding:4px 10px;font-size:.8rem}
.famgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fam{border:2px solid transparent;border-radius:12px;padding:9px 4px;font-weight:800;font-size:.82rem;background:color-mix(in srgb,var(--fc) 13%,var(--surface));color:var(--fc)}
.fam.on{border-color:var(--fc)}
@media (prefers-color-scheme: dark){
  .fam,.rep h3{color:color-mix(in srgb,var(--fc) 55%,#fff)}
  .entry b,.preview b{color:color-mix(in srgb,var(--fc) 50%,#fff)}
}
.besoin{font-size:.85rem;font-style:italic;color:var(--muted);margin:8px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.picked{min-height:38px;padding:8px;border:1px dashed var(--border);border-radius:12px}
.preview{background:color-mix(in srgb,var(--lav) 28%,var(--surface));border-radius:12px;padding:12px;margin-top:14px;font-size:.95rem}
.preview .k{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);display:block;margin-bottom:4px}

/* Calendrier */
.calhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.calhead h1{flex:1;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding-bottom:2px}
.cday{aspect-ratio:1;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:0;font-weight:600;font-size:.9rem;position:relative;display:grid;place-items:center;overflow:hidden}
.cday.vert{background:var(--vert);border-color:var(--vert);color:#fff}
.cday.jaune{background:var(--jaune);border-color:var(--jaune);color:#3a2e00}
.cday.rouge{background:var(--rouge);border-color:var(--rouge);color:#fff}
.cday.today{outline:2px solid var(--brand);outline-offset:1px}
.cday.future{opacity:.35}
.cday .has{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cday.vert .has,.cday.rouge .has{background:#fff}.cday.jaune .has{background:#3a2e00}
/* Coin plié : note personnelle ce jour-là */
.cday .nt{position:absolute;top:0;right:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--brand) transparent transparent}
.cday.vert .nt,.cday.rouge .nt{border-right-color:#fff}.cday.jaune .nt{border-right-color:#3a2e00}
/* Filtre : la couleur du jour reste au centre, encadrée par la couleur du filtre (fin liseré pour séparer deux teintes proches) */
.cday.hit{border:3px solid var(--fc);box-shadow:inset 0 0 0 2px var(--surface)}
.cal.filtre .cday.today{outline:0;font-weight:800;text-decoration:underline;text-underline-offset:3px}   /* à ne pas confondre avec un cadre */
.seg.two{grid-template-columns:1fr 1fr;margin:0 0 14px}
/* Vue liste */
.lday{border-left:5px solid var(--dc,var(--border));padding-bottom:8px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0 0 8px;text-align:left;font-weight:800;color:var(--brand)}
.colpill{flex:none;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.colpill.vert{background:var(--vert-bg);color:var(--vert-fg)}.colpill.jaune{background:var(--jaune-bg);color:var(--jaune-fg)}.colpill.rouge{background:var(--rouge-bg);color:var(--rouge-fg)}
.occ{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:10px 0}
.occ:first-of-type{border-top:0}
.occ .meta{font-size:.8rem;color:var(--muted);font-weight:700}
.occ .txt{margin-top:2px;font-size:.92rem}
.occ b{color:var(--fc)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:8px 0}
.bar div{height:100%}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.stat:last-child{border-bottom:0}

/* Répertoire */
.rep{border-left:5px solid var(--fc)}
.rep h3{color:var(--fc);font-size:1.05rem}
.rep .lvl{margin:8px 0 0;font-size:.92rem}
.rep .lvl b{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;display:block}
.key{background:color-mix(in srgb,var(--lav) 40%,var(--surface));border-color:transparent}

/* Barre de navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;justify-content:center;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}

/* Dialogues */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);width:100%;max-width:560px;max-height:92dvh;border-radius:20px 20px 0 0;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:rgba(20,14,10,.45)}
@media (min-width:600px){dialog{border-radius:20px;margin:auto}}
.dlg-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);z-index:1}
.dlg-b{padding:4px 16px 16px}
.dlg-f{position:sticky;bottom:0;background:var(--surface);display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--border)}
.dlg-f .btn{flex:1}
.err{color:var(--rouge);font-size:.88rem;min-height:1.3em;margin-top:8px}

/* Verrouillage */
#lock{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.lockcard{width:100%;max-width:400px;text-align:center}
.tagline{margin:6px 0 0;color:var(--accent);font-style:italic}
.lockcard .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:block}
.lockcard form{text-align:left;margin-top:18px}
.lockcard ul{text-align:left;padding-left:18px;margin:14px 0;font-size:.9rem;color:var(--muted)}
.warn{background:var(--jaune-bg);color:var(--jaune-fg);border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:12px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.setrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0}
.setrow>label{font-weight:600}
.setrow select{width:auto}
a{color:var(--accent)}

/* Profils client / thérapeute */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role{display:flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.role:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.role input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.fp{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;color:var(--text)}
.banner{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--lav) 35%,var(--surface));border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:.9rem}
.banner span{flex:1}
.banner-actions{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.safari-avis{text-align:left}
.lockcard .safari-avis{margin:14px 0 0}
.maj-banner{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;margin:0;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.clientbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.clientbar .who{font-weight:800;color:var(--brand);text-align:right}
.clientrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.clientrow .small{grid-column:1 / -1}
.strip{display:flex;gap:3px}
.strip i{width:12px;height:12px;border-radius:3px;background:var(--surface2)}
.strip i.vert{background:var(--vert)}.strip i.jaune{background:var(--jaune)}.strip i.rouge{background:var(--rouge)}
.synth-ro{white-space:pre-wrap;margin:0}
.colors.one{grid-template-columns:1fr}
#invField{margin-top:8px;font-size:.8rem;word-break:break-all}
.envois{list-style:none;margin:6px 0 0;padding:0;font-size:.9rem}
.envois li{padding:7px 0;border-bottom:1px solid var(--border)}
.envois li:last-child{border-bottom:0}

/* Administration */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.tile{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:1.35rem;color:var(--brand);line-height:1.1}
.tile span{font-size:.72rem;color:var(--muted)}
table.stats{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
table.stats th,table.stats td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:right}
table.stats th[scope=row],table.stats thead th:first-child{text-align:left;font-weight:600}
table.stats thead th{font-size:.75rem;color:var(--muted);font-weight:700}
table.stats td{font-variant-numeric:tabular-nums;font-weight:700}
table.stats tr:last-child>*{border-bottom:0}
.lim-g{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
.lim-g h3{font-size:.92rem;margin:0}
.lim{margin-top:10px}
.lim-h{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
.lim-h b{white-space:nowrap}
.meter{--m:var(--accent);height:8px;border-radius:99px;margin:5px 0 3px;overflow:hidden;background:color-mix(in srgb,var(--m) 20%,var(--surface))}
.meter i{display:block;height:100%;min-width:4px;border-radius:99px;background:var(--m)}
.meter.m-warn{--m:var(--jaune)}
.meter.m-crit{--m:var(--rouge)}
.lim-alerte{color:var(--text)}
.urow{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.uhead{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px}
.uhead .ufoot{grid-column:1 / -1}
.badge{font:700 .75rem/1 ui-monospace,Menlo,Consolas,monospace;padding:5px 7px;border-radius:7px;background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--brand)}
.badge.th{background:color-mix(in srgb,var(--lav) 45%,var(--surface))}
b.off{color:var(--rouge)}
.udetail{padding:0 12px 12px;border-top:1px solid var(--border)}
.udetail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.88rem}
.udetail dt{color:var(--muted)}
.udetail dd{margin:0;word-break:break-word}
</style>
</head>
<body>

<section id="lock" hidden></section>

<div id="app" hidden>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
</div>

<dialog id="entryDlg" aria-labelledby="entryTitle"></dialog>
<dialog id="codeDlg"></dialog>
<dialog id="clientDlg" aria-label="Fiche client"></dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';

/* ───────────── Répertoire des émotions (Liberté pour Aimer) ───────────── */
const FAM = [
  {k:'peur', n:'Peur', b:'Besoin de sécurité & de protection', c:'#5B6BB5',
   l:['Inquiet(e)','Préoccupé(e)','Hésitant(e)','Méfiant(e)','Indécis(e)'],
   m:['Anxieux(se)','Angoissé(e)','Insécure','Craintif(ve)','Vulnérable','Tendu(e)'],
   i:['Terrorisé(e)','Paniqué(e)','Effrayé(e)','Sidéré(e)','En détresse']},

/* ───────────── Chiffrement (AES-GCM 256, clé dérivée du code par PBKDF2) ───────────── */
let VKEY = null;                                  // journal de l'utilisateur connecté sur cet appareil
const vaultKey = id => 'journal-emotions.vault.' + id;
const LEGACY_VKEY = 'journal-emotions.vault';     // journal créé avant les comptes
const ITER = 250000;
let key = null, salt = null, data = null;

function toB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

async function deriveKey(code, saltU8, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealData(obj, k, saltU8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc.encode(JSON.stringify(obj))));
  return {app:'journal-emotions', v:1, iter:ITER, salt:toB64(saltU8), iv:toB64(iv), ct:toB64(ct)};
}
async function openVault(v, code) {
  const s = fromB64(v.salt);
  const k = await deriveKey(code, s, v.iter || ITER);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, k, fromB64(v.ct));
  return {k, s, obj: JSON.parse(dec.decode(pt))};
}

let saveTimer, savePending = Promise.resolve();
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  clearTimeout(saveTimer);
  if (!key) return savePending;
  const snapshot = data, k = key, s = salt, vk = VKEY;
  savePending = savePending.then(async () => {
    localStorage.setItem(vk, JSON.stringify(await sealData(snapshot, k, s)));
  }).catch(err => { console.error(err); toast('Erreur d’enregistrement'); });
  return savePending;
}

const LOGIN_ERR = {
  identifiants: 'Identifiant ou mot de passe incorrect.',
  desactive: 'Ce compte a été désactivé par l’administrateur. Contactez l’administrateur.',
  reseau: 'Pas de connexion internet : impossible de vérifier votre compte.',
};
async function onLogin(e) {
  e.preventDefault();
  const id = $('#lId').value.trim().toLowerCase(), pw = $('#lPw').value, err = $('#lockErr'), btn = $('#loginBtn');
  if (!id || !pw) return err.textContent = 'Indiquez votre identifiant et votre mot de passe.';
  if (Date.now() < blockedUntil) return err.textContent = `Trop d’essais. Réessayez dans ${Math.ceil((blockedUntil - Date.now()) / 1000)} s.`;
  const fail = msg => { err.textContent = msg; btn.disabled = false; btn.textContent = 'Se connecter'; };
  btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
  try {
    await API.signIn(id, pw);
    profil = await API.rpc('ouvrir_session');
    if (!profil?.actif) { API.signOut(); profil = null; return fail(LOGIN_ERR.desactive); }
  } catch (x) {
    // hors connexion : le journal déjà présent sur cet appareil s'ouvre avec le mot de passe
    if (x.code === 'reseau' && localStorage.getItem(vaultKey(id))) { session = null; profil = null; }
    else {
      if (x.code === 'identifiants' && ++fails >= 5) blockedUntil = Date.now() + 30000 * (fails - 4);
      return fail(LOGIN_ERR[x.code] || 'Connexion impossible pour le moment. Réessayez plus tard.');
    }
  }
  fails = 0;
  try { await openJournal(id, pw); }
  catch (x) { if (x.code !== 'journal') console.error(x); API.signOut(); profil = null; fail(x.code === 'journal' ? x.message : 'Impossible d’ouvrir le journal de cet appareil.'); }
}

async function onSignup(e) {
  e.preventDefault();
  const v = s => $(s).value.trim(), err = $('#lockErr'), btn = $('#signupBtn');
  const f = {role:document.querySelector('input[name=role]:checked').value, prenom:v('#sPrenom'), nom:v('#sNom'), identifiant:v('#sId').toLowerCase(), password:$('#sPw').value};
  if (!f.prenom || !f.nom) return err.textContent = 'Indiquez votre prénom et votre nom.';
  if (!ID_RE.test(f.identifiant)) return err.textContent = 'Identifiant : 3 à 30 caractères, lettres minuscules, chiffres, point ou tiret.';
  if (f.password.length < 8) return err.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
  if (f.password !== $('#sPw2').value) return err.textContent = 'Les deux mots de passe ne correspondent pas.';
  const mail = v('#sMail').toLowerCase();
  if (!EMAIL_RE.test(mail)) return err.textContent = 'Indiquez un mail de récupération valide.';
  if (mail !== v('#sMail2').toLowerCase()) return err.textContent = 'Les deux mails de récupération ne correspondent pas.';
  btn.disabled = true; btn.textContent = 'Création…'; err.textContent = '';
  try { await API.signUp({...f, nom:f.role === 'therapeute' ? f.nom : initiale(f.nom)}); profil = await API.rpc('ouvrir_session'); }
  catch (x) {
    btn.disabled = false; btn.textContent = 'Créer mon compte';
    return err.textContent = {
      pris: 'Cet identifiant est déjà utilisé : choisissez-en un autre.',
      faible: 'Mot de passe trop simple : allongez-le ou ajoutez des chiffres.',
      reseau: 'Une connexion internet est nécessaire pour créer un compte.',
      confirmation: 'Le serveur demande une confirmation par e-mail : désactivez-la dans Supabase (Authentication › Email).',
    }[x.code] || 'Création impossible pour le moment. Réessayez plus tard.';
  }
  differeMail = true;   // le mail vient d'être saisi : rien à redemander
  try {
    await openJournal(f.identifiant, f.password, {role:f.role, profile:{prenom:f.prenom, nom:f.nom}});
    if (await setRecovery(mail, f.password, true) !== true) { mailPasse = true; majRappelRecup(); }
  } finally { differeMail = false; }
}

/* Ouvre (ou crée) le journal chiffré de ce compte sur cet appareil */
async function openJournal(id, pw, init) {
  VKEY = vaultKey(id);
  const raw = localStorage.getItem(VKEY);
  if (raw) {
    let r;
    try { r = await openVault(JSON.parse(raw), pw); }
    catch {
      if (!session) throw apiErr('journal', 'Mot de passe incorrect.');   // hors connexion
      // mot de passe changé depuis un autre appareil : l'ancien rouvre le journal de celui-ci
      const old = await askCode('Journal de cet appareil', {label:'Ancien mot de passe', hint:'Votre mot de passe a changé depuis votre dernière connexion ici. Entrez l’ancien pour rouvrir le journal de cet appareil.'});
      if (old == null) throw apiErr('journal', 'Journal de cet appareil non ouvert.');
      try { r = await openVault(JSON.parse(raw), old); } catch { throw apiErr('journal', 'Ancien mot de passe incorrect.'); }
      r.s = crypto.getRandomValues(new Uint8Array(16)); r.k = await deriveKey(pw, r.s);
    }
    key = r.k; salt = r.s; data = defaults(r.obj);
  } else {
    salt = crypto.getRandomValues(new Uint8Array(16)); key = await deriveKey(pw, salt);
    data = defaults(init || {});
  }
  applyProfil();
  data.account ||= {identifiant:id};
  localStorage.setItem(LAST_ID, id);
  if (data.settings.autolock === -1) { await rememberKey().catch(() => {}); rememberSession(); }
  if (data.role === 'therapeute') await ensureKeys(); else await saveNow();
  navigator.storage?.persist?.();
  showApp(); pushProfile(); flushStats(); ensureSecours(pw).then(ok => ok && exigerMail());
}

function applyProfil() {
  if (!profil) return;
  data.role = profil.role;
  data.account = {identifiant:profil.identifiant, numero:profil.numero, est_admin:!!profil.est_admin, recup:!!data.account?.recup};
  if (!data.profile.nom && !data.profile.prenom) Object.assign(data.profile, {nom:profil.nom, prenom:profil.prenom});
}

/* Récupération par e-mail : le serveur garde une clé de secours et seulement une empreinte de l'adresse.
   Cet appareil garde la clé du journal chiffrée par la clé de secours : aucun des deux, seul, n'ouvre les notes. */
const secoursKey = id => 'journal-emotions.secours.' + id;
/* Aide-mémoire pour « Mot de passe oublié » : uniquement la version masquée, lisible sans ouvrir le journal */
const indiceKey = id => 'journal-emotions.indice.' + id;
function syncIndice() {
  const k = indiceKey(data.account.identifiant);
  if (data.recupIndice) localStorage.setItem(k, data.recupIndice); else localStorage.removeItem(k);
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function passwordBits(pw, saltU8) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt:saltU8, iterations:ITER, hash:'SHA-256'}, base, 256);
}
/* Met à jour l'état de la récupération ; avec le mot de passe, recrée aussi la copie de secours de la clé */
async function ensureSecours(pw) {
  if (!session || !data) return;
  try {
    const cle = await API.rpc('ma_cle_secours');
    if (!data) return;
    const sk = secoursKey(data.account.identifiant);
    const etat = cle ? await API.rpc('ma_recuperation_etat') : null;
    if (!data) return;
    data.account.recup = etat?.confirmee ? 'confirmee' : etat?.attente ? 'attente' : false;
    data.account.recupChange = !!(etat?.confirmee && etat.attente);
    if (data.account.recup !== 'attente' && !data.account.recupChange) { delete data.recupMail; delete data.recupEnvoi; }
    if (!cle) { delete data.recupIndice; delete data.recupIndiceNouveau; }
    else if (etat?.confirmee && !etat.attente && data.recupIndiceNouveau) { data.recupIndice = data.recupIndiceNouveau; delete data.recupIndiceNouveau; }
    syncIndice();
    if (!cle) localStorage.removeItem(sk);
    else if (pw) {
      const k = await crypto.subtle.importKey('raw', fromB64(cle), 'AES-GCM', false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, await passwordBits(pw, salt)));
      localStorage.setItem(sk, JSON.stringify({iv:toB64(iv), ct:toB64(ct)}));
    }
    save();
    if (view === 'set' && !src) render(true);
    else majRappelRecup();
    return true;
  } catch (x) { console.warn('Récupération indisponible', x.code); }
}
/* Après un mot de passe oublié : rouvre le journal de l'appareil avec la clé de secours et le rechiffre */
async function rescueJournal(id, cle, newPw) {
  try {
    const v = JSON.parse(localStorage.getItem(vaultKey(id))), b = JSON.parse(localStorage.getItem(secoursKey(id)));
    if (!v || !b) return false;
    const ks = await crypto.subtle.importKey('raw', fromB64(cle), 'AES-GCM', false, ['decrypt']);
    const bits = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(b.iv)}, ks, fromB64(b.ct));
    const old = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const obj = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, old, fromB64(v.ct))));
    const s = crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem(vaultKey(id), JSON.stringify(await sealData(obj, await deriveKey(newPw, s), s)));
    return true;
  } catch (x) { console.warn('Journal non repris', x); return false; }
}
/* Mail de récupération obligatoire : il est demandé à l'ouverture tant qu'il n'est pas confirmé.
   Sans internet ou si l'envoi échoue, le journal reste accessible : un compte ne perd jamais l'accès à ses notes pour cette raison. */
let differeMail = false, mailPasse = false;
function exigerMail() {
  if (differeMail || mailPasse || !session || !data?.account || $('dialog[open]')) return;
  if (data.account.recup === 'attente') openRecupCode(true);
  else if (!data.account.recup) demanderMail(true);
}
async function demanderMail(oblig) {
  const r = await askRecovery(oblig);
  if (!r) { if (oblig) await lock(); return; }
  const res = await setRecovery(r.email, r.pw, oblig);
  if (res === true || !oblig) return;
  if (res === 'patience') return demanderMail(true);
  mailPasse = true; majRappelRecup();
}
function askRecovery(oblig) {

        <label class="label" for="rMail">Adresse e-mail</label>

async function setRecovery(email, pw, oblig) {
  try {
    await API.recup({action:'definir', email});
    // gardée dans le journal chiffré de l'appareil, le temps de pouvoir renvoyer le code
    data.recupMail = email; data.recupEnvoi = new Date().toISOString(); data.recupIndiceNouveau = masque(email);
    await saveNow();
    await ensureSecours(pw);
    openRecupCode(oblig);
    return true;
  } catch (x) {
    toast(ENVOI_ERR[x.code] || 'Mail non enregistré : réessayez plus tard.');
    await ensureSecours(pw);
    return x.code || false;
  }
}
const ENVOI_ERR = {reseau:'Pas de connexion internet.', patience:'Attendez une minute avant un nouvel envoi.', envoi:'L’e-mail n’a pas pu être envoyé : réessayez dans un instant.'};
const recupAConfirmer = () => data?.account?.recup === 'attente' || !!data?.account?.recupChange;
const attenteRenvoi = () => data?.recupEnvoi ? Math.max(0, 60 - Math.floor((Date.now() - new Date(data.recupEnvoi)) / 1000)) : 0;

/* Rappel permanent tant que l'adresse n'est pas confirmée : sans confirmation, aucun code de récupération ne peut partir */
function recupReminder() {
  if (!session) return '';
  if (!data.account?.recup) return `<div class="banner recup-rappel"><span>Ajoutez votre mail de récupération : il est obligatoire pour récupérer votre compte et pour effacer vos données.</span>

      <input type="text" id="rcCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code">

/* Effacer ses données : code reçu par e-mail si une adresse est confirmée, sinon mot de passe.

const EFFACER_ERR = {reseau:'Pas de connexion internet.', patience:'Attendez une minute avant un nouvel envoi.', envoi:'L’e-mail n’a pas pu être envoyé : réessayez dans un instant.',
  adresse:'Cette adresse n’est pas votre adresse de récupération confirmée.', limite:'Trop de demandes aujourd’hui : réessayez demain.', code:'Code incorrect ou expiré. Vous pouvez en demander un nouveau.'};
function effacerParCode() {
  return new Promise(resolve => {
    const dlg = $('#codeDlg');
    let mail = '', envoi = 0, enCours = false, minuteur;
    dlg.innerHTML = `<form method="dialog" id="efForm">
      <div class="dlg-h"><h2>Confirmer l’effacement</h2></div>
      <div class="dlg-b">
        <p class="small muted" id="efInfo">Pour vérifier que c’est bien vous, entrez votre adresse de récupération : un code à 6 chiffres vous sera envoyé.</p>

          ${data.recupIndice ? `<div class="small muted" style="margin-top:4px">Pour vous aider : <b>${esc(data.recupIndice)}</b></div>` : ''}</div>
        <div id="efCodeBloc" hidden>
          <label class="label" for="efCode">Code reçu par e-mail</label>

      <div class="dlg-f"><button type="button" class="btn" id="efCancel">Annuler</button><button class="btn primary" id="efOk">Recevoir un code</button></div>
    </form>`;
    const fin = ok => { busy = false; clearInterval(minuteur); dlg.onclose = null; if (dlg.open) dlg.close(); resolve(ok); };
    const err = m => $('#efErr').textContent = m;
    const maj = () => {
      const b = $('#efResend'), s = Math.max(0, 60 - Math.floor((Date.now() - envoi) / 1000));
      if (b) { b.disabled = s > 0; b.textContent = s ? `Renvoyer le code dans ${s} s` : 'Renvoyer le code'; }
    };
    const demander = () => API.recup({action:'effacer_demande', email:mail}).then(() => {
      envoi = Date.now(); maj();
      if (!data.recupIndice) { data.recupIndice = masque(mail); save(); syncIndice(); }   // compte confirmé avant l'existence de l'aide-mémoire
    });
    $('#efCancel').onclick = () => fin(false);
    dlg.onclose = () => fin(false);   // touche Échap
    $('#efResend').onclick = async () => {
      err('');
      try { await demander(); toast('Nouveau code envoyé'); } catch (x) { err(EFFACER_ERR[x.code] || 'Envoi impossible pour le moment.'); }
    };
    $('#efForm').onsubmit = async e => {
      e.preventDefault();
      if (enCours) return;
      err(''); enCours = true;
      try {

          if (!EMAIL_RE.test(m)) return err('Indiquez votre adresse de récupération.');
          mail = m;

          $('#efMailBloc').hidden = true; $('#efCodeBloc').hidden = false;
          $('#efInfo').innerHTML = `Un code à 6 chiffres a été envoyé à <b>${esc(mail)}</b>. Il est valable 15 minutes. <b>Pensez à regarder dans vos courriers indésirables.</b><br>Saisir ce code effacera définitivement vos notes de ce téléphone.`;

      } catch (x) { err(EFFACER_ERR[x.code] || 'Action impossible pour le moment.'); }
      finally { enCours = false; }

    dlg.showModal();

/* « Rester connecté » (déconnexion automatique : Jamais) : la clé du journal, non exportable, reste dans ce
   navigateur ; le jeton de connexion au serveur est enregistré dans le journal chiffré. */
function keyDb(mode, fn) {
  return new Promise((ok, ko) => {
    const o = indexedDB.open('journal-emotions', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('cle');
    o.onerror = () => ko(o.error);
    o.onsuccess = () => {
      const t = o.result.transaction('cle', mode), r = fn(t.objectStore('cle'));
      t.oncomplete = () => { o.result.close(); ok(r.result); };
      t.onerror = t.onabort = () => { o.result.close(); ko(t.error); };
    };
  });
}
const rememberKey = () => keyDb('readwrite', s => s.put({id:data.account.identifiant, key}, 'courante'));
const forgetKey = () => keyDb('readwrite', s => s.delete('courante')).catch(() => {});
function rememberSession() {
  if (data?.settings.autolock !== -1) return;
  const t = API.token();
  if (t) { data.resume = t; save(); }
}
async function setAutolock(t) {
  const v = +t.value;
  if (v === -1 && !confirm('Rester connecté sur cet appareil ?\n\nToute personne ayant accès à ce téléphone déverrouillé pourra ouvrir votre journal sans mot de passe. À éviter sur un appareil partagé.')) {
    t.value = data.settings.autolock; return;
  }
  data.settings.autolock = v;
  try {
    if (v === -1) { await rememberKey(); rememberSession(); }
    else { await forgetKey(); delete data.resume; }
  } catch { data.settings.autolock = 1; t.value = 1; toast('Ce navigateur ne permet pas de rester connecté.'); }
  save();
}
/* À l'ouverture : journal rouvert sans mot de passe si l'utilisateur a choisi de rester connecté */
async function boot() {
  const s = await keyDb('readonly', st => st.get('courante')).catch(() => null);
  if (!s) return showLock();
  try {
    const v = JSON.parse(localStorage.getItem(vaultKey(s.id)));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, s.key, fromB64(v.ct));
    VKEY = vaultKey(s.id); key = s.key; salt = fromB64(v.salt); data = defaults(JSON.parse(dec.decode(pt)));
  } catch { await forgetKey(); return showLock(); }
  showApp();
  syncSession();
}
/* En arrière-plan : reprend la connexion au serveur. Sans internet, le journal reste simplement ouvert. */
async function syncSession() {
  if (!data?.resume) return;
  try {
    await API.resume(data.resume);
    profil = await API.rpc('ouvrir_session');
    if (!data) return;
    if (!profil?.actif) return lock(LOGIN_ERR.desactive);

    applyProfil(); rememberSession();

      if (rappel) $('#view').insertAdjacentHTML('afterbegin', rappel);
    }

  } catch (x) {
    if (!data) return;
    if (x.code === 'desactive') lock(LOGIN_ERR.desactive);

/* Sauvegarde en un appui : le fichier chiffré est préparé immédiatement, car le menu de partage du téléphone
   doit s'ouvrir directement après l'appui. Rappel si la dernière sauvegarde date de plus de 7 jours. */
const SAUVEGARDE_JOURS = 7;
const aDesDonnees = () => Object.values(data.days).some(dayFilled) || Object.keys(data.clients).length > 0;
const joursDepuis = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);
function sauvegardeReminder() {
  if (!aDesDonnees() || data.backupPlusTard === today()) return '';
  const premier = Object.keys(data.days).filter(k => dayFilled(data.days[k])).sort()[0];
  const j = data.backupAt ? joursDepuis(data.backupAt) : premier ? joursDepuis(parse(premier)) : SAUVEGARDE_JOURS + 1;
  if (j <= SAUVEGARDE_JOURS) return '';
  return `<div class="banner sauvegarde-rappel"><span>${data.backupAt ? `Dernière sauvegarde il y a ${j} jours.` : 'Aucune sauvegarde pour l’instant.'} Sans sauvegarde, vos notes seraient perdues avec votre téléphone.</span>
    <div class="banner-actions"><button class="btn primary" data-act="backup">Sauvegarder</button><button class="link small" data-act="backupLater">Plus tard</button></div></div>`;
}
async function sauvegarder() {
  const contenu = localStorage.getItem(VKEY);
  if (!contenu) return toast('Rien à sauvegarder pour le moment.');
  const name = `motus-sauvegarde_${today()}.json`, file = new File([contenu], name, {type:'application/json'});
  busy = true;
  try {
    if (navigator.canShare?.({files:[file]})) await navigator.share({files:[file], title:'Sauvegarde Motus'});
    else download(file, name);
  } catch (err) {
    if (err.name === 'AbortError') return;   // annulé par l'utilisateur : le rappel reste affiché
    download(file, name);
  } finally { setTimeout(() => busy = false, 1500); }
  data.backupAt = new Date().toISOString(); delete data.backupPlusTard;
  await saveNow();
  $('.sauvegarde-rappel')?.remove();
  if (view === 'set' && !src) render(true);
  toast('Sauvegarde créée. Elle s’ouvre avec votre mot de passe actuel.');
}

/* Journal créé avant les comptes : proposé tant qu'il n'est pas récupéré, et jamais effacé sans demande explicite */
const hasLegacy = () => !!localStorage.getItem(LEGACY_VKEY);
function mergeJournal(cur, old) {
  for (const [k, d] of Object.entries(old.days)) {
    const c = cur.days[k];
    if (!c) { cur.days[k] = d; continue; }
    const ids = new Set(c.entries.map(e => e.id));
    c.entries.push(...d.entries.filter(e => !ids.has(e.id)));
    const nids = new Set(dayNotes(c).map(n => n.id)), nouvelles = dayNotes(d).filter(n => !nids.has(n.id));
    if (nouvelles.length) c.notes = [...dayNotes(c), ...nouvelles];
    c.color ||= d.color;
    if (d.synth?.trim() && c.synth !== d.synth) c.synth = c.synth?.trim() ? `${c.synth}\n${d.synth}` : d.synth;
  }
  if (!cur.therapist && old.therapist) { cur.therapist = old.therapist; cur.uid = old.uid; }
  cur.keys ||= old.keys;
  cur.sent = {...old.sent, ...cur.sent};
  cur.clients = {...old.clients, ...cur.clients};
  if (old.profile.start && old.profile.start < cur.profile.start) cur.profile.start = old.profile.start;
  return cur;
}
async function adoptLegacy() {
  const code = await askCode('Récupérer l’ancien journal', {label:'Code de l’ancien journal', hint:'C’est le code que vous tapiez pour ouvrir l’app avant la création des comptes. Ce n’est ni votre nouveau mot de passe, ni un code reçu par e-mail. Vous pouvez essayer autant de fois que nécessaire.'});
  if (code == null) return;
  let r;
  try { r = await openVault(JSON.parse(localStorage.getItem(LEGACY_VKEY)), code); }
  catch { return toast('Code incorrect : l’ancien journal reste conservé, vous pourrez réessayer.'); }
  data = mergeJournal(data, defaults(r.obj));
  await saveNow();
  // l'ancien journal n'est retiré qu'après avoir relu et vérifié la nouvelle copie enregistrée
  try {
    const v = JSON.parse(localStorage.getItem(VKEY));
    const relu = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(v.iv)}, key, fromB64(v.ct))));
    if (!Object.keys(r.obj.days || {}).every(k => relu.days[k])) throw new Error('copie incomplète');
    localStorage.removeItem(LEGACY_VKEY);
  } catch (x) { console.error(x); render(); return toast('Enregistrement à vérifier : l’ancien journal est conservé.'); }
  render(); toast('Ancien journal récupéré : vos notes ont été ajoutées à ce compte');
}

  return `<div class="banner"><span>Un ancien journal, créé avant les comptes, est conservé sur cet appareil. Pour récupérer ses notes, il vous faut le code que vous utilisiez pour l’ouvrir.</span>

}

    ${ro ? `

    <p class="label">Synthèse</p>

}

/* — Vue Calendrier — */
function vCal() {
  const first = new Date(calY, calM, 1), nDays = new Date(calY, calM + 1, 0).getDate();
  const off = (first.getDay() + 6) % 7, t = today();
  const now = new Date(), atCurrent = calY === now.getFullYear() && calM === now.getMonth();
  let cells = ['L','M','M','J','V','S','D'].map(w => `<div class="wd">${w}</div>`).join('');
  cells += '<div></div>'.repeat(off);
  const cnt = {vert:0, jaune:0, rouge:0}, words = {}, fams = {};
  let nEntries = 0, pastDays = 0;
  const fam = calF && FAMK[calF], notesOnly = calF === 'notes', filtre = fam || notesOnly, occ = [], occN = [], fWords = {};
  const cadre = fam ? fam.c : 'var(--brand)';
  let fDays = 0, nNotes = 0;
  for (let i = 1; i <= nDays; i++) {
    const k = ymd(new Date(calY, calM, i)), d = D().days[k], fut = k > t, ns = dayNotes(d);
    if (!fut) pastDays++;
    nNotes += ns.length;
    if (notesOnly) ns.forEach(n => occN.push({k, n}));
    if (d?.color) cnt[d.color]++;
    let maxI = -1; // intensité la plus forte de l'émotion filtrée ce jour-là
    (d?.entries || []).forEach(e => {
      nEntries++;
      e.emos.forEach(x => { words[x.w] = (words[x.w]||0) + 1; fams[x.f] = (fams[x.f]||0) + 1; if (x.f === calF) fWords[x.w] = (fWords[x.w]||0) + 1; });
      const hit = fam ? e.emos.filter(x => x.f === calF && (!calW || x.w === calW)) : [];
      if (hit.length) { occ.push({k, e}); maxI = Math.max(maxI, ...hit.map(x => INT.findIndex(([c]) => c === x.i))); }
    });
    const hit = fam ? maxI >= 0 : notesOnly && ns.length > 0;
    if (hit) fDays++;
    const lab = (d?.color ? ', ' + esc(D().labels[d.color]) : '') + (maxI >= 0 ? `, ${fam.n} ${INT[maxI][1].toLowerCase()}` : '') + (ns.length ? ', note personnelle' : '');
    cells += `<button class="cday ${d?.color || ''} ${hit ? 'hit' : ''} ${k === t ? 'today' : ''} ${fut ? 'future' : ''}"${hit ? ` style="--fc:${cadre}"` : ''} data-act="openDay" data-k="${k}" ${fut ? 'disabled' : ''}
      aria-label="${fmtLong(k)}${lab}">${i}${!filtre && d?.entries?.length ? '<span class="has"></span>' : ''}${!filtre && ns.length ? '<span class="nt"></span>' : ''}</button>`;
  }
  occ.sort((a, b) => (a.k + a.e.time).localeCompare(b.k + b.e.time));
  occN.sort((a, b) => (a.k + a.n.time).localeCompare(b.k + b.n.time));
  const dayName = k => `${JOURS[parse(k).getDay()]} ${parse(k).getDate()} ${MOIS[calM]}`;

  const filterCard = `
  <section class="card">
    <h2>Afficher</h2>
    <div class="chips" style="margin-top:10px">
      <button class="chip ${!filtre ? 'on' : ''}" style="--fc:var(--brand)" data-act="calFilter" data-f="" aria-pressed="${!filtre}">Tout</button>
      ${src ? '' : `<button class="chip ${notesOnly ? 'on' : ''}" style="--fc:var(--brand)" data-act="calFilter" data-f="notes" aria-pressed="${notesOnly}">Notes personnelles</button>`}
      ${FAM.map(f => `<button class="chip ${calF === f.k ? 'on' : ''}" style="--fc:${f.c}" data-act="calFilter" data-f="${f.k}" aria-pressed="${calF === f.k}">${f.n}</button>`).join('')}
    </div>
    ${fam ? `<p class="label">Émotion précise</p><div class="chips">
      <button class="chip ${!calW ? 'on' : ''}" style="--fc:${fam.c}" data-act="calWord" data-w="" aria-pressed="${!calW}">Toutes</button>
      ${[...new Set([...Object.keys(fWords), ...(calW ? [calW] : [])])].map(w => `<button class="chip ${calW === w ? 'on' : ''}" style="--fc:${fam.c}" data-act="calWord" data-w="${esc(w)}" aria-pressed="${calW === w}">${esc(w)}${fWords[w] ? ' · ' + fWords[w] : ''}</button>`).join('')}
    </div>` : ''}
  </section>`;
  const legend = COL.map(c => `<span><i style="background:var(--${c})"></i>${esc(D().labels[c])}</span>`).join('')
    + (filtre ? `<span><i style="border:3px solid ${cadre}"></i>${esc(fam ? calW || fam.n : 'Note personnelle')}</span>`
      : '<span><i style="background:var(--accent);width:6px;height:6px;border-radius:50%"></i>émotions notées</span>'
        + (src ? '' : '<span><i style="width:0;height:0;border-radius:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--brand) transparent transparent"></i>note personnelle</span>'));
  const occCard = fam ? `
  <section class="card">
    <h2>${esc(calW || fam.n)} · ${MOIS[calM]}</h2>
    <p class="small muted" style="margin:6px 0 4px">${occ.length ? `${fDays} jour${fDays > 1 ? 's' : ''} concerné${fDays > 1 ? 's' : ''} · ${occ.length} note${occ.length > 1 ? 's' : ''}` : 'Aucune note avec cette émotion ce mois-ci.'}</p>
    ${occ.map(({k, e}) => `<button class="occ" data-act="openDay" data-k="${k}">
      <div class="meta">${dayName(k)} · ${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</div>
      <div class="txt">${sentenceHtml(e)}</div>
    </button>`).join('')}
  </section>` : `
  <section class="card">
    <h2>Notes personnelles · ${MOIS[calM]}</h2>
    <p class="small muted" style="margin:6px 0 4px">${occN.length ? `${fDays} jour${fDays > 1 ? 's' : ''} concerné${fDays > 1 ? 's' : ''} · ${occN.length} note${occN.length > 1 ? 's' : ''}` : 'Aucune note personnelle ce mois-ci.'}</p>
    ${occN.map(({k, n}) => `<button class="occ" data-act="openDay" data-k="${k}">
      <div class="meta">${dayName(k)} · ${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''}</div>
      <div class="txt note-txt">${esc(n.text)}</div>
    </button>`).join('')}
  </section>`;
  /* Vue liste : les journées du mois, de la plus récente à la plus ancienne */
  function listCards() {
    const out = [];
    for (let i = nDays; i >= 1; i--) {
      const k = ymd(new Date(calY, calM, i)), d = D().days[k];
      if (!d || k > t) continue;
      const ents = (d.entries || []).filter(e => !fam || e.emos.some(x => x.f === calF && (!calW || x.w === calW)));
      const lignes = [
        ...(notesOnly ? [] : ents.map(e => ({time:e.time, html:`<div class="meta">${esc(e.time)}${where(e) ? ' · ' + esc(where(e)) : ''}</div><div class="txt">${sentenceHtml(e)}</div>`}))),
        ...(fam ? [] : dayNotes(d).map(n => ({time:n.time, html:`<div class="meta">${esc(n.time)}${where(n) ? ' · ' + esc(where(n)) : ''} · Note personnelle</div><div class="txt note-txt">${esc(n.text)}</div>`}))),
      ].sort((a, b) => a.time.localeCompare(b.time));
      const synth = !filtre && d.synth?.trim();
      if (!lignes.length && !synth && (filtre || !d.color)) continue;
      out.push(`<section class="card lday"${d.color ? ` style="--dc:var(--${d.color})"` : ''}>
        <button class="lhead" data-act="openDay" data-k="${k}"><span>${dayName(k)}</span><span class="colpill ${d.color || ''}">${d.color ? esc(D().labels[d.color]) : 'Sans couleur'}</span></button>
        ${lignes.map(l => `<button class="occ" data-act="openDay" data-k="${k}">${l.html}</button>`).join('')}
        ${synth ? `<button class="occ" data-act="openDay" data-k="${k}"><div class="meta">Synthèse</div><div class="txt note-txt">${esc(d.synth)}</div></button>` : ''}
      </section>`);
    }
    return out.join('') || `<section class="card"><p class="empty">${filtre ? 'Rien pour ce filtre' : 'Rien de noté'} en ${MOIS[calM]}.</p></section>`;
  }
  const noted = cnt.vert + cnt.jaune + cnt.rouge;
  const topW = Object.entries(words).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const famTot = Object.values(fams).reduce((a,b) => a+b, 0);
  const famS = Object.entries(fams).sort((a,b) => b[1]-a[1]);
  return `
  ${clientBar()}${srcImportCard()}
  <div class="calhead">
    <button class="icon-btn" data-act="prevMonth" aria-label="Mois précédent">‹</button>
    <h1>${MOIS[calM]} ${calY}</h1>
    <button class="icon-btn" data-act="nextMonth" aria-label="Mois suivant" ${atCurrent ? 'disabled' : ''}>›</button>
  </div>
  <div class="seg two">
    <button class="${calMode === 'grid' ? 'on' : ''}" data-act="calMode" data-m="grid" aria-pressed="${calMode === 'grid'}">Calendrier</button>
    <button class="${calMode === 'list' ? 'on' : ''}" data-act="calMode" data-m="list" aria-pressed="${calMode === 'list'}">Liste</button>
  </div>
  ${filterCard}
  ${calMode === 'list' ? listCards() : `<section class="card">
    <div class="cal ${filtre ? 'filtre' : ''}">${cells}</div>
    <div class="legend">${legend}</div>
  </section>
  ${filtre ? occCard : `<section class="card">
    <h2>Bilan du mois</h2>
    ${noted ? `<div class="bar">${COL.map(c => cnt[c] ? `<div style="width:${cnt[c]/noted*100}%;background:var(--${c})"></div>` : '').join('')}</div>` : ''}
    ${COL.map(c => `<div class="stat"><span>${esc(D().labels[c])}</span><b>${cnt[c]}</b></div>`).join('')}
    <div class="stat"><span class="muted">Jours sans couleur</span><b class="muted">${pastDays - noted}</b></div>
    <div class="stat"><span class="muted">Émotions notées</span><b class="muted">${nEntries}</b></div>
    ${src ? '' : `<div class="stat"><span class="muted">Notes personnelles</span><b class="muted">${nNotes}</b></div>`}
  </section>
  ${famS.length ? `<section class="card">
    <h2>Émotions du mois</h2>
    <div class="bar">${famS.map(([f,n]) => `<div title="${FAMK[f].n}" style="width:${n/famTot*100}%;background:${FAMK[f].c}"></div>`).join('')}</div>
    <div class="chips">${famS.map(([f,n]) => `<span class="chip static" style="--fc:${FAMK[f].c}">${FAMK[f].n} · ${Math.round(n/famTot*100)} %</span>`).join('')}</div>
    <p class="label">Les plus fréquentes</p>
    ${topW.map(([w,n]) => `<div class="stat"><span>${esc(w)}</span><b>${n}</b></div>`).join('')}
  </section>` : ''}`}`}
  ${srcCard()}`;
}

/* ───────────── Lien client ↔ thérapeute (sans serveur) ─────────────
   Le thérapeute possède une paire de clés ECDH P-256 ; sa clé publique circule dans le lien d'invitation.
   Chaque envoi du client est chiffré avec une clé éphémère : seul ce thérapeute peut le déchiffrer. */
const ECDH = {name:'ECDH', namedCurve:'P-256'};
const THERA_TYPES = ['Psychologue','Psychiatre','Psychothérapeute','Thérapie brève','Gestalt-thérapie','TCC','Hypnothérapeute','Sophrologue','Autre'];
const rid = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');
const b64url = s => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); return s + '='.repeat((4 - s.length % 4) % 4); };
const lastOf = a => a[a.length - 1];

async function fingerprint(pkB64) {
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', fromB64(pkB64)))].slice(0, 4);
  const x = h.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  return x.slice(0, 4) + '-' + x.slice(4);
}
async function ensureKeys() {
  if (data.keys) return;
  const kp = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
  const pub = toB64(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)));
  data.keys = {pub, priv: await crypto.subtle.exportKey('jwk', kp.privateKey), fp: await fingerprint(pub)};
  await saveNow();
}
async function sharedKey(priv, pub, usage) {
  const bits = await crypto.subtle.deriveBits({name:'ECDH', public:pub}, priv, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:enc.encode('journal-emotions'), info:enc.encode('envoi-v1')}, hk, {name:'AES-GCM', length:256}, false, [usage]);
}
async function sealFor(th, obj) {
  const pub = await crypto.subtle.importKey('raw', fromB64(th.pk), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveBits']);
  const k = await sharedKey(eph.privateKey, pub, 'encrypt'), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc.encode(JSON.stringify(obj))));
  const epk = toB64(new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey)));
  return {app:'journal-emotions', type:'envoi', v:1, to:th.fp, epk, iv:toB64(iv), ct:toB64(ct)};
}
async function openEnvoi(pkg) {
  const priv = await crypto.subtle.importKey('jwk', data.keys.priv, ECDH, false, ['deriveBits']);
  const epk = await crypto.subtle.importKey('raw', fromB64(pkg.epk), ECDH, false, []);
  const k = await sharedKey(priv, epk, 'decrypt');
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(pkg.iv)}, k, fromB64(pkg.ct))));
}

/* — Invitation : clé publique + coordonnées du thérapeute, dans la partie « # » du lien (jamais envoyée à un serveur) — */
function inviteCode() {
  const p = data.profile, t = data.thera;
  const o = {v:1, pk:data.keys.pub, nom:p.nom, prenom:p.prenom, type:t.type, tel:t.tel, email:t.email, adresse:t.adresse};
  return b64url(toB64(enc.encode(JSON.stringify(o))));
}
const inviteLink = () => `${location.origin}${location.pathname}#inv=${inviteCode()}`;
const refreshInvite = () => { const f = $('#invField'); if (f && data.keys) f.value = inviteLink(); };
async function readInvite(text) {
  const m = String(text).trim().match(/(?:#inv=)?([A-Za-z0-9_-]{40,})\s*$/);
  if (!m) throw new Error('format');
  const o = JSON.parse(dec.decode(fromB64(unb64url(m[1]))));
  if (o.v !== 1 || !o.pk) throw new Error('format');
  await crypto.subtle.importKey('raw', fromB64(o.pk), ECDH, false, []); // clé valide ?
  o.fp = await fingerprint(o.pk);
  return o;
}
async function offerInvite(text) {
  let o;
  try { o = await readInvite(text); } catch { return toast('Lien d’invitation non reconnu.'); }
  if (data.role === 'therapeute') return toast('Ce lien est destiné à vos clients.');
  const who = `${o.prenom || ''} ${o.nom || ''}`.trim() || 'ce thérapeute', old = data.therapist;
  if (old?.fp === o.fp) { Object.assign(old, o); await saveNow(); render(); return toast('Coordonnées du thérapeute mises à jour'); }
  if (!confirm(`Ajouter ${who}${o.type ? ' (' + o.type + ')' : ''} comme thérapeute ?\n\nCode de sécurité : ${o.fp}\nVérifiez qu’il correspond à celui que vous a donné votre thérapeute.`
    + (old ? `\n\n${old.prenom} ${old.nom} ne sera plus votre thérapeute dans l’app.` : ''))) return;
  data.therapist = {...o, addedAt: new Date().toISOString()};
  await saveNow(); render(); toast(`${who} est maintenant votre thérapeute`);
}

async function importEnvoi(f, targetId) {
  const c = data.clients[targetId]; if (!c) return;
  let pkg;
  try { pkg = JSON.parse(await f.text()); if (pkg.app !== 'journal-emotions' || pkg.type !== 'envoi') throw 0; }
  catch { return toast('Ce fichier n’est pas un envoi du journal.'); }
  if (pkg.to !== data.keys?.fp) return toast('Ce fichier a été chiffré pour un autre thérapeute.');
  let o;
  try { o = await openEnvoi(pkg); } catch { return toast('Impossible d’ouvrir ce fichier (abîmé ou clé différente).'); }
  const sender = `${o.client.prenom} ${o.client.nom}`.trim() || 'un client sans nom';
  if (c.uid && c.uid !== o.client.id) {
    if (!confirm(`Ce fichier vient de l’app de ${sender}, qui n’est pas celle liée à la fiche de ${fullName(c)}.\n\nL’importer quand même dans cette fiche ?`)) return;
  } else if (!c.uid) {
    const other = Object.values(data.clients).find(x => x.uid === o.client.id);
    if (other) {
      if (!confirm(`Les envois de ${sender} sont déjà importés dans la fiche de ${fullName(other)}.\n\nImporter aussi ce fichier dans la fiche de ${fullName(c)} ?`)) return;
    } else {
      if (sender.toLowerCase() !== fullName(c).toLowerCase()
        && !confirm(`Ce fichier a été envoyé par ${sender}.\n\nLe rattacher à la fiche de ${fullName(c)} ? Les prochains envois de cette personne seront reconnus automatiquement.`)) return;
      c.uid = o.client.id;
    }
  }
  if (!c.profile.start || o.from < c.profile.start) c.profile.start = o.from;
  c.labels = {...DEF_LABELS, ...o.labels};
  for (let k = o.from; k <= o.to; k = addDays(k, 1)) { if (o.days[k]) c.days[k] = o.days[k]; else delete c.days[k]; }
  c.envois = c.envois.filter(x => !(x.from === o.from && x.to === o.to));
  c.envois.push({from:o.from, to:o.to, sentAt:o.sentAt, importedAt:new Date().toISOString()});
  c.envois.sort((a, b) => a.from.localeCompare(b.from));
  await saveNow();
  toast(`Période du ${fmtFR(o.from).slice(0, 5)} au ${fmtFR(o.to).slice(0, 5)} importée`);
  openClient(c.id);
}

async function loadLimites() {
  adm.limEnCours = true;

  const [r, g, b] = await Promise.allSettled([
    API.rpc('admin_ressources'),
    fetch(`https://api.github.com/repos/${GH_DEPOT}`).then(x => x.ok ? x.json() : Promise.reject()),
    API.recup({action:'quota_envoi'}),

/* Jauge : la couleur porte la sévérité, toujours accompagnée d'un texte */
function jauge(label, used, max, fmt, note = '') {
  if (used == null) return `<div class="lim"><div class="lim-h"><span>${label}</span><span class="muted">Non disponible</span></div>${note ? `<div class="small muted">${note}</div>` : ''}</div>`;
  const pct = Math.min(100, used / max * 100), niv = pct >= 95 ? 'crit' : pct >= 80 ? 'warn' : '';
  return `<div class="lim">
    <div class="lim-h"><span>${label}</span><b>${fmt(used)} / ${fmt(max)}</b></div>
    <div class="meter ${niv && 'm-' + niv}" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="small muted">${niv ? `<b class="lim-alerte">⚠ ${niv === 'crit' ? 'Limite atteinte ou presque' : 'Limite proche'}</b> · ` : ''}Il reste ${fmt(Math.max(max - used, 0))}${note ? ` · ${note}` : ''}</div>
  </div>`;
}

/* Valeurs déjà saisies pour un champ (lieu, ville), les plus récentes d'abord */
function recent(field) {
  const seen = new Map();
  Object.keys(data.days).sort().reverse().forEach(k => [...data.days[k].entries, ...dayNotes(data.days[k])].sort((a,b) => b.time.localeCompare(a.time)).forEach(e => {
    const l = (e[field] || '').trim(); if (l && !seen.has(l.toLowerCase())) seen.set(l.toLowerCase(), l);
  }));
  return [...seen.values()].slice(0, 20);
}

/* ───────────── Ville automatique : GPS + liste des communes intégrée (aucun envoi) ───────────── */
let communes = null;
function loadCommunes() {
  return communes ||= fetch('communes.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
    const lines = t.split('\n'), n = new Array(lines.length), la = new Float64Array(lines.length), lo = new Float64Array(lines.length);
    lines.forEach((l, i) => { const [a, b, c] = l.split('\t'); n[i] = a; la[i] = +b; lo[i] = +c; });
    return {n, la, lo};
  }).catch(err => { communes = null; throw err; });
}
async function nearestCity(lat, lon) {
  const C = await loadCommunes(), k = Math.cos(lat * Math.PI / 180);
  let best = -1, bd = Infinity;
  for (let i = 0; i < C.n.length; i++) {
    const dy = C.la[i] - lat, dx = (C.lo[i] - lon) * k, d = dx*dx + dy*dy;
    if (d < bd) { bd = d; best = i; }
  }
  return Math.sqrt(bd) * 111 < 25 ? C.n[best] : null; // à plus de 25 km d'un centre de commune : hors de France
}
/* Le réglage de l'app ne suffit pas : le téléphone et le navigateur doivent aussi donner la position à Motus */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
/* Sur iPhone, Safari et l'app de l'écran d'accueil ont chacun leur stockage : les notes de l'un n'apparaissent pas dans l'autre */
const safariAvis = () => IOS && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches
  ? '<div class="banner safari-avis"><span>Installez Motus avec le bouton Partager › « Sur l’écran d’accueil », puis notez uniquement depuis l’icône : les notes de Safari et celles de l’app ne sont pas partagées.</span></div>' : '';
async function geoRefus() {
  if (IOS) return 'L’iPhone ne donne pas la position à Motus. Dans les Réglages de l’iPhone, vérifiez : Confidentialité et sécurité › Service de localisation (activé, et autorisé pour les sites Safari), puis Safari › Localisation.';
  let etat = '';
  try { etat = (await navigator.permissions.query({name:'geolocation'})).state; } catch {}
  if (etat === 'denied') return `Le navigateur bloque la position pour Motus. Dans Chrome : Paramètres › Paramètres des sites › Position, puis autorisez ${location.hostname}.`;
  return 'Le téléphone ne donne pas la position à Motus. Vérifiez que la localisation du téléphone est activée et autorisée pour le navigateur.';
}
function trouverVille() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko('Localisation indisponible sur cet appareil.');
    navigator.geolocation.getCurrentPosition(async p => {
      try {
        const v = await nearestCity(p.coords.latitude, p.coords.longitude);
        v ? ok(v) : ko('Ville non trouvée (hors de France ?).');
      } catch { ko('Liste des communes indisponible.'); }
    }, async err => ko(err.code === 1 ? await geoRefus() : 'Position introuvable pour le moment.'),
    {enableHighAccuracy:false, timeout:15000, maximumAge:300000});
  });
}
function locate(force) {
  const me = ed, status = msg => { const s = $('#geoSt'); if (s && ed === me) s.textContent = msg; };
  status('Recherche de la ville…');
  trouverVille().then(v => {
    if (ed !== me) return;
    if (force || !me.villeTouched) $('#eVille').value = v;
    status('');
  }, msg => status(force ? `${msg} Vous pouvez aussi saisir la ville.` : 'Ville non détectée. Touchez l’épingle pour en savoir plus, ou saisissez-la.'));
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) {
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), body = enc.encode(f.data), crc = crc32(body);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, body.length, true); h.setUint32(22, body.length, true); h.setUint16(26, name.length, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, body.length, true); c.setUint32(24, body.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    parts.push(new Uint8Array(h.buffer), name, body);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((a, u) => a + u.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

  + `<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>`

const S = {title:1, sub:2, lab:3, val:4, sect:5, vert:6, jaune:7, rouge:8, legend:9, txt:10, head:11, week:12, cell:13, cvert:14, cjaune:15, crouge:16, conf:17, off:18};
const cellStyle = c => c ? S['c' + c] : S.cell;
const estLines = (t, w) => t.split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / w)), 0);

function buildXlsx(from, to) {
  const L = D().labels, p = D().profile;
  const keys = []; for (let k = from; k <= to; k = addDays(k, 1)) keys.push(k);
  const byTime = d => [...d.entries].sort((a,b) => a.time.localeCompare(b.time));

  /* Feuille 1 : tableau d'observation hebdomadaire (mise en page du modèle) */
  const H = 'ABCDEFGH'.split(''), fill = (r, s) => H.slice(1).map(c => cE(c + r, s));
  const r1 = [
    xRow(1, [cS('A1', S.title, 'TABLEAU D\'OBSERVATION'), ...fill(1, S.title)], 28),
    xRow(2, [cS('A2', S.sub, 'Motus — Éclairer ce qui se passe en soi'), ...fill(2, S.sub)], 18),
    xRow(4, [cS('A4', S.lab, 'Nom :'), cS('B4', S.val, p.nom), cE('C4', S.val), cS('D4', S.lab, 'Prénom :'), cS('E4', S.val, p.prenom), cE('F4', S.val),
      cS('G4', S.lab, 'Période :'), cS('H4', S.val, `${fmtFR(from)} – ${fmtFR(to)}`)], 22),
    xRow(6, [cS('A6', S.sect, 'CONSIGNES & CODE COULEUR DE LA JOURNÉE'), ...fill(6, S.sect)], 24),
    xRow(7, [cS('A7', S.vert, 'VERT'), cS('B7', S.legend, L.vert), cS('C7', S.jaune, 'JAUNE'), cS('D7', S.legend, L.jaune), cS('E7', S.rouge, 'ROUGE'), cS('F7', S.legend, L.rouge)], 22),
    xRow(8, [cS('A8', S.txt, '• Au fil de la journée : heure / ville / lieu — « Je me sens [émotion du répertoire] car [ce qui l’a déclenchée]. »')], 18),
    xRow(9, [cS('A9', S.txt, '• Chaque soir : une synthèse de la journée et une couleur (vert, jaune ou rouge).')], 18),
    xRow(10, [cS('A10', S.conf, 'Ce tableau est confidentiel et constitue une base de travail essentielle.')], 18),
    xRow(12, [cS('A12', S.head, 'Semaine / Date'), ...['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map((j, i) => cS(H[i+1] + 12, S.head, j))], 28),
  ];
  const base = p.start && p.start <= from ? mondayOf(p.start) : mondayOf(from);
  let r = 13;
  for (let mon = mondayOf(from); mon <= to; mon = addDays(mon, 7), r++) {
    const n = Math.round((parse(mon) - parse(base)) / 864e5 / 7) + 1;
    const cells = [cS('A' + r, S.week, `SEMAINE ${n}\n\nLundi :\n${fmtFR(mon)}`)];
    let lines = 4;
    for (let i = 0; i < 7; i++) {
      const k = addDays(mon, i), ref = H[i+1] + r, d = D().days[k];
      if (k < from || k > to) { cells.push(cE(ref, S.off)); continue; }
      if (!dayUsed(d)) { cells.push(cS(ref, S.cell, fmtFR(k).slice(0, 5))); continue; }
      let t = fmtFR(k).slice(0, 5) + (d.color ? ' — ' + L[d.color] : '');
      byTime(d).forEach(e => t += `\n\n${e.time}${where(e) ? ' · ' + where(e) : ''}\n${sentence(e)}`);
      if (d.synth?.trim()) t += `\n\nSYNTHÈSE : ${d.synth.trim()}`;
      lines = Math.max(lines, estLines(t, 34));
      cells.push(cS(ref, cellStyle(d.color), t));
    }
    r1.push(xRow(r, cells, Math.min(409, Math.max(60, lines * 11.5 + 8))));
  }
  const s1 = sheet({cols:[16,30,30,30,30,30,30,30], rows:r1, merges:['A1:H1','A2:H2','B4:C4','E4:F4','A6:H6','A8:H8','A9:H9','A10:H10'], landscape:true});

  /* Feuille 2 : détail de chaque émotion notée */
  const h2 = ['Date','Jour','Heure','Ville','Lieu','Émotion','Intensité','Je me sens…','… car','Couleur du jour'];
  const r2 = [xRow(1, h2.map((h, i) => cS(colL(i) + 1, S.head, h)), 26)];
  let n2 = 2;
  for (const k of keys) {
    const d = D().days[k]; if (!d?.entries?.length) continue;
    for (const e of byTime(d)) {
      const vals = [fmtFR(k), JOURS[parse(k).getDay()], e.time, e.ville || '', e.lieu,
        [...new Set(e.emos.map(x => FAMK[x.f].n))].join(', '),
        [...new Set(e.emos.map(x => INTN[x.i]))].join(', '),
        joinFr(e.emos.map(x => lc(x.w))), (e.car || '').trim()];
      const row = vals.map((v, i) => cS(colL(i) + n2, S.cell, v)), cc = colL(vals.length) + n2;
      row.push(d.color ? cS(cc, cellStyle(d.color), L[d.color]) : cE(cc, S.cell));
      r2.push(xRow(n2, row, Math.min(409, Math.max(15, Math.max(estLines(e.car || '', 60), estLines(vals[7], 34)) * 12 + 4))));
      n2++;
    }
  }
  const s2 = sheet({cols:[11,10,7,16,16,14,11,30,55,18], rows:r2, landscape:true});

  /* Feuille 3 : synthèses quotidiennes */
  const h3 = ['Date','Jour','Couleur','Nb d’émotions notées','Synthèse de la journée'];
  const r3 = [xRow(1, h3.map((h, i) => cS(colL(i) + 1, S.head, h)), 26)];
  let n3 = 2;
  for (const k of keys) {
    const d = D().days[k]; if (!dayUsed(d)) continue;
    const st = cellStyle(d.color);
    r3.push(xRow(n3, [cS('A' + n3, st, fmtFR(k)), cS('B' + n3, st, JOURS[parse(k).getDay()]), d.color ? cS('C' + n3, st, L[d.color]) : cE('C' + n3, st),
      cN('D' + n3, st, d.entries.length), cS('E' + n3, st, (d.synth || '').trim())], Math.min(409, Math.max(15, estLines(d.synth || '', 85) * 12 + 4))));
    n3++;
  }
  const s3 = sheet({cols:[11,10,18,12,80], rows:r3});

  const names = ['Tableau d’observation', 'Détail des émotions', 'Synthèses'];
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zip([
    {name:'[Content_Types].xml', data: X + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${[1,2,3].map(i => `<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels', data: X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data: X + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data: X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${[1,2,3].map(i => `<Relationship Id="rId${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`).join('')}<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:STYLES},
    {name:'xl/worksheets/sheet1.xml', data:s1},
    {name:'xl/worksheets/sheet2.xml', data:s2},
    {name:'xl/worksheets/sheet3.xml', data:s3},
  ]);
}

function weekLabel() {
  const end = addDays(xStart, 6);
  return `${end === today() ? '<div class="small muted">Les 7 derniers jours</div>' : ''}Du <b>${fmtDay(xStart)}</b><br>au <b>${fmtDay(end)} ${parse(end).getFullYear()}</b>`;
}
function setWeek(n) {
  xStart = addDays(xStart, 7 * n);
  if (addDays(xStart, 6) > today()) xStart = addDays(today(), -6);
  $('#wkLabel').innerHTML = weekLabel();
  $('#xNext').disabled = addDays(xStart, 6) >= today();
  $('#xFrom').value = xStart; $('#xTo').value = addDays(xStart, 6);
  $('#xFromWd').textContent = weekday(xStart); $('#xToWd').textContent = weekday(addDays(xStart, 6));
  const st = $('#sentSt'); if (st) st.textContent = sentStatus();
}
function exportRange() {
  let from = xStart, to = addDays(xStart, 6);
  if ($('#xCustom').open) { from = $('#xFrom').value; to = $('#xTo').value; }
  if (!from || !to) { toast('Choisissez une période.'); return null; }
  if (from > to) [from, to] = [to, from];
  return {from, to, name:`Motus_${from}_${to}.xlsx`};
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function withBusy(fn) { busy = true; try { await fn(); } finally { setTimeout(() => busy = false, 1500); } }

/* ───────────── Dialogue de saisie du code ───────────── */
function askCode(title, {confirm = false, hint = '', label = 'Mot de passe', min = 8} = {}) {
  return new Promise(resolve => {
    const D = $('#codeDlg');
    D.innerHTML = `<form method="dialog" id="codeForm">
      <div class="dlg-h"><h2>${esc(title)}</h2></div>
      <div class="dlg-b">
        ${hint ? `<p class="small muted">${esc(hint)}</p>` : ''}
        <label class="label" for="cd1">${confirm ? `Nouveau mot de passe (${min} caractères minimum)` : esc(label)}</label>
        <input type="password" id="cd1" autocomplete="${confirm ? 'new-password' : 'current-password'}">
        ${confirm ? '<label class="label" for="cd2">Confirmez</label><input type="password" id="cd2" autocomplete="new-password">' : ''}
        <div class="err" id="cdErr"></div>
      </div>
      <div class="dlg-f"><button type="button" class="btn" id="cdCancel">Annuler</button><button class="btn primary">Valider</button></div>
    </form>`;
    const done = v => { D.close(); resolve(v); };
    $('#cdCancel').onclick = () => done(null);
    D.oncancel = () => resolve(null);
    $('#codeForm').onsubmit = e => {
      e.preventDefault();
      const v = $('#cd1').value;
      if (confirm) {
        if (v.length < min) return $('#cdErr').textContent = `Au moins ${min} caractères.`;
        if (v !== $('#cd2').value) return $('#cdErr').textContent = 'Les deux mots de passe ne correspondent pas.';
      }
      done(v);
    };
    D.showModal();
  });
}
