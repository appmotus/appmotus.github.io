function recent(field) {
  const seen = new Map();
  Object.keys(data.days).sort().reverse().forEach(k => [...data.days[k].entries, ...dayNotes(data.days[k])].sort((a,b) => b.time.localeCompare(a.time)).forEach(e => {
    const l = (e[field] || '').trim(); if (l && !seen.has(l.toLowerCase())) seen.set(l.toLowerCase(), l);
  }));
  return [...seen.values()].slice(0, 20);
}

/* ───────────── Ville automatique : GPS + liste des communes intégrée (aucun envoi) ───────────── */
let communes = null;
function loadCommunes() {
  return communes ||= fetch('communes.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
    const lines = t.split('\n'), n = new Array(lines.length), la = new Float64Array(lines.length), lo = new Float64Array(lines.length);
    lines.forEach((l, i) => { const [a, b, c] = l.split('\t'); n[i] = a; la[i] = +b; lo[i] = +c; });
    return {n, la, lo};
  }).catch(err => { communes = null; throw err; });
}
async function nearestCity(lat, lon) {
  const C = await loadCommunes(), k = Math.cos(lat * Math.PI / 180);
  let best = -1, bd = Infinity;
  for (let i = 0; i < C.n.length; i++) {
    const dy = C.la[i] - lat, dx = (C.lo[i] - lon) * k, d = dx*dx + dy*dy;
    if (d < bd) { bd = d; best = i; }
  }
  return Math.sqrt(bd) * 111 < 25 ? C.n[best] : null; // à plus de 25 km d'un centre de commune : hors de France
}
/* Le réglage de l'app ne suffit pas : le téléphone et le navigateur doivent aussi donner la position à Motus */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
/* Sur iPhone, Safari et l'app de l'écran d'accueil ont chacun leur stockage : les notes de l'un n'apparaissent pas dans l'autre */
const safariAvis = () => IOS && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches
  ? '<div class="banner safari-avis"><span>Installez Motus avec le bouton Partager › « Sur l’écran d’accueil », puis notez uniquement depuis l’icône : les notes de Safari et celles de l’app ne sont pas partagées.</span></div>' : '';
async function geoRefus() {
  if (IOS) return 'L’iPhone ne donne pas la position à Motus. Dans les Paramètres de l’iPhone, vérifiez : Confidentialité et sécurité › Service de localisation (activé, et autorisé pour les sites Safari), puis Safari › Localisation.';
  let etat = '';
  try { etat = (await navigator.permissions.query({name:'geolocation'})).state; } catch {}
  if (etat === 'denied') return `Le navigateur bloque la position pour Motus. Dans Chrome : Paramètres › Paramètres des sites › Position, puis autorisez ${location.hostname}.`;
  return 'Le téléphone ne donne pas la position à Motus. Vérifiez que la localisation du téléphone est activée et autorisée pour le navigateur.';
}
function trouverVille() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko('Localisation indisponible sur cet appareil.');
    navigator.geolocation.getCurrentPosition(async p => {
      try {
        const v = await nearestCity(p.coords.latitude, p.coords.longitude);
        v ? ok(v) : ko('Ville non trouvée (hors de France ?).');
      } catch { ko('Liste des communes indisponible.'); }
    }, async err => ko(err.code === 1 ? await geoRefus() : 'Position introuvable pour le moment.'),
    {enableHighAccuracy:false, timeout:15000, maximumAge:300000});
  });
}
function locate(force) {

}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) {
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), body = enc.encode(f.data), crc = crc32(body);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, body.length, true); h.setUint32(22, body.length, true); h.setUint16(26, name.length, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, body.length, true); c.setUint32(24, body.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    parts.push(new Uint8Array(h.buffer), name, body);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((a, u) => a + u.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const S = {title:1, sub:2, lab:3, val:4, sect:5, vert:6, jaune:7, rouge:8, legend:9, txt:10, head:11, week:12, cell:13, cvert:14, cjaune:15, crouge:16, conf:17, off:18};
const cellStyle = c => c ? S['c' + c] : S.cell;
const estLines = (t, w) => t.split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / w)), 0);

function buildXlsx(from, to) {
  const L = D().labels, p = D().profile;
  const avecNotes = !!src;   // l'Excel du client ne contient pas ses notes personnelles ; celui du thérapeute contient celles qu'il a reçues
  const keys = []; for (let k = from; k <= to; k = addDays(k, 1)) keys.push(k);
  const byTime = d => [...d.entries].sort((a,b) => a.time.localeCompare(b.time));

  /* Feuille 1 : tableau d'observation hebdomadaire (mise en page du modèle) */
  const H = 'ABCDEFGH'.split(''), fill = (r, s) => H.slice(1).map(c => cE(c + r, s));
  const r1 = [
    xRow(1, [cS('A1', S.title, 'TABLEAU D\'OBSERVATION'), ...fill(1, S.title)], 28),
    xRow(2, [cS('A2', S.sub, 'Motus — Éclairer ce qui se passe en soi'), ...fill(2, S.sub)], 18),
    xRow(4, [cS('A4', S.lab, 'Nom :'), cS('B4', S.val, p.nom), cE('C4', S.val), cS('D4', S.lab, 'Prénom :'), cS('E4', S.val, p.prenom), cE('F4', S.val),
      cS('G4', S.lab, 'Période :'), cS('H4', S.val, `${fmtFR(from)} – ${fmtFR(to)}`)], 22),
    xRow(6, [cS('A6', S.sect, 'CONSIGNES & CODE COULEUR DE LA JOURNÉE'), ...fill(6, S.sect)], 24),
    xRow(7, [cS('A7', S.vert, 'VERT'), cS('B7', S.legend, L.vert), cS('C7', S.jaune, 'JAUNE'), cS('D7', S.legend, L.jaune), cS('E7', S.rouge, 'ROUGE'), cS('F7', S.legend, L.rouge)], 22),
    xRow(8, [cS('A8', S.txt, '• Au fil de la journée : heure / ville / lieu — « Je me sens [émotion du répertoire] car [ce qui l’a déclenchée]. »')], 18),
    xRow(9, [cS('A9', S.txt, '• Chaque soir : une synthèse de la journée et une couleur (vert, jaune ou rouge).')], 18),
    xRow(10, [cS('A10', S.conf, 'Ce tableau est confidentiel et constitue une base de travail essentielle.')], 18),
    xRow(12, [cS('A12', S.head, 'Semaine / Date'), ...['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map((j, i) => cS(H[i+1] + 12, S.head, j))], 28),
  ];
  const debut = D().debutSuivi || p.start;   // fiche client : semaines comptées depuis l'acceptation
  const base = debut && debut <= from ? mondayOf(debut) : mondayOf(from);
  let r = 13;
  for (let mon = mondayOf(from); mon <= to; mon = addDays(mon, 7), r++) {
    const n = Math.round((parse(mon) - parse(base)) / 864e5 / 7) + 1;
    const cells = [cS('A' + r, S.week, `SEMAINE ${n}\n\nLundi :\n${fmtFR(mon)}`)];
    let lines = 4;
    for (let i = 0; i < 7; i++) {
      const k = addDays(mon, i), ref = H[i+1] + r, d = D().days[k];
      if (k < from || k > to) { cells.push(cE(ref, S.off)); continue; }
      if (!(avecNotes ? dayFilled(d) : dayUsed(d))) { cells.push(cS(ref, S.cell, fmtFR(k).slice(0, 5))); continue; }
      let t = fmtFR(k).slice(0, 5) + (d.color ? ' — ' + L[d.color] : '');
      byTime(d).forEach(e => t += `\n\n${e.time}${where(e) ? ' · ' + where(e) : ''}\n${sentence(e)}`);
      if (d.synth?.trim()) t += `\n\nSYNTHÈSE : ${d.synth.trim()}`;
      if (avecNotes) dayNotes(d).forEach(n => t += `\n\nNOTE PERSONNELLE ${n.time}${where(n) ? ' · ' + where(n) : ''} :\n${n.text}`);
      lines = Math.max(lines, estLines(t, 34));
      cells.push(cS(ref, cellStyle(d.color), t));
    }
    r1.push(xRow(r, cells, Math.min(409, Math.max(60, lines * 11.5 + 8))));
  }
  const s1 = sheet({cols:[16,30,30,30,30,30,30,30], rows:r1, merges:['A1:H1','A2:H2','B4:C4','E4:F4','A6:H6','A8:H8','A9:H9','A10:H10'], landscape:true});

  /* Feuille 2 : détail de chaque émotion notée */
  const h2 = ['Date','Jour','Heure','Ville','Lieu','Émotion','Intensité','Je me sens…','… car','Couleur du jour'];
  const r2 = [xRow(1, h2.map((h, i) => cS(colL(i) + 1, S.head, h)), 26)];
  let n2 = 2;
  for (const k of keys) {
    const d = D().days[k]; if (!d?.entries?.length) continue;
    for (const e of byTime(d)) {
      const vals = [fmtFR(k), JOURS[parse(k).getDay()], e.time, e.ville || '', e.lieu,
        [...new Set(e.emos.map(x => FAMK[x.f].n))].join(', '),
        [...new Set(e.emos.map(x => INTN[x.i]))].join(', '),
        joinFr(e.emos.map(x => lc(x.w))), (e.car || '').trim()];
      const row = vals.map((v, i) => cS(colL(i) + n2, S.cell, v)), cc = colL(vals.length) + n2;
      row.push(d.color ? cS(cc, cellStyle(d.color), L[d.color]) : cE(cc, S.cell));
      r2.push(xRow(n2, row, Math.min(409, Math.max(15, Math.max(estLines(e.car || '', 60), estLines(vals[7], 34)) * 12 + 4))));
      n2++;
    }
  }
  const s2 = sheet({cols:[11,10,7,16,16,14,11,30,55,18], rows:r2, landscape:true});

  /* Feuille 3 : synthèses quotidiennes */
  const h3 = ['Date','Jour','Couleur','Nb d’émotions notées','Synthèse de la journée'];
  const r3 = [xRow(1, h3.map((h, i) => cS(colL(i) + 1, S.head, h)), 26)];
  let n3 = 2;
  for (const k of keys) {
    const d = D().days[k]; if (!dayUsed(d)) continue;
    const st = cellStyle(d.color);
    r3.push(xRow(n3, [cS('A' + n3, st, fmtFR(k)), cS('B' + n3, st, JOURS[parse(k).getDay()]), d.color ? cS('C' + n3, st, L[d.color]) : cE('C' + n3, st),
      cN('D' + n3, st, d.entries.length), cS('E' + n3, st, (d.synth || '').trim())], Math.min(409, Math.max(15, estLines(d.synth || '', 85) * 12 + 4))));
    n3++;
  }
  const s3 = sheet({cols:[11,10,18,12,80], rows:r3});
  const feuilles = [['Tableau d’observation', s1], ['Détail des émotions', s2], ['Synthèses', s3]];

  /* Feuille 4, pour le thérapeute : les notes personnelles que le client a choisi de lui transmettre */
  if (avecNotes) {
    const h4 = ['Date','Jour','Heure','Ville','Lieu','Note personnelle'];
    const r4 = [xRow(1, h4.map((h, i) => cS(colL(i) + 1, S.head, h)), 26)];
    let n4 = 2;
    for (const k of keys) for (const n of [...dayNotes(D().days[k])].sort((a, b) => a.time.localeCompare(b.time))) {
      const vals = [fmtFR(k), JOURS[parse(k).getDay()], n.time, n.ville || '', n.lieu || '', n.text];
      r4.push(xRow(n4, vals.map((v, i) => cS(colL(i) + n4, S.cell, v)), Math.min(409, Math.max(15, estLines(n.text, 85) * 12 + 4))));
      n4++;
    }
    if (n4 > 2) feuilles.push(['Notes personnelles', sheet({cols:[11,10,7,16,16,80], rows:r4})]);
  }

  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', nums = feuilles.map((f, i) => i + 1);
  return zip([
    {name:'[Content_Types].xml', data: X + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${nums.map(i => `<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels', data: X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data: X + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${feuilles.map(([n], i) => `<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data: X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${nums.map(i => `<Relationship Id="rId${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`).join('')}<Relationship Id="rId${feuilles.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:STYLES},
    ...feuilles.map(([, data], i) => ({name:`xl/worksheets/sheet${i + 1}.xml`, data})),
  ]);
}

function weekLabel() {
  const end = addDays(xStart, 6);
  return `${end === today() ? '<div class="small muted">Les 7 derniers jours</div>' : ''}Du <b>${fmtDay(xStart)}</b><br>au <b>${fmtDay(end)} ${parse(end).getFullYear()}</b>`;
}
function setWeek(n) {
  xStart = addDays(xStart, 7 * n);
  if (addDays(xStart, 6) > today()) xStart = addDays(today(), -6);
  $('#wkLabel').innerHTML = weekLabel();
  $('#xNext').disabled = addDays(xStart, 6) >= today();
  $('#xFrom').value = xStart; $('#xTo').value = addDays(xStart, 6);
  $('#xFromWd').textContent = weekday(xStart); $('#xToWd').textContent = weekday(addDays(xStart, 6));
  const st = $('#sentSt'); if (st) st.textContent = sentStatus();
}
function exportRange() {
  let from = xStart, to = addDays(xStart, 6);
  if ($('#xCustom').open) { from = $('#xFrom').value; to = $('#xTo').value; }
  if (!from || !to) { toast('Choisissez une période.'); return null; }
  if (from > to) [from, to] = [to, from];
  return {from, to, name:`Motus_${from}_${to}.xlsx`};
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

        ${hint ? `<p class="small muted">${esc(hint)}</p>` : ''}
        <label class="label" for="cd1">${confirm ? `Nouveau mot de passe (${min} caractères minimum)` : esc(label)}</label>
        <input type="password" id="cd1" autocomplete="${confirm ? 'new-password' : 'current-password'}">
        ${confirm ? '<label class="label" for="cd2">Confirmez</label><input type="password" id="cd2" autocomplete="new-password">' : ''}
        <div class="err" id="cdErr"></div>
      </div>
      <div class="dlg-f"><button type="button" class="btn" id="cdCancel">Annuler</button><button class="btn primary">Valider</button></div>
    </form>`;
    const done = v => { D.close(); resolve(v); };
    $('#cdCancel').onclick = () => done(null);
    D.oncancel = () => resolve(null);
    $('#codeForm').onsubmit = e => {
      e.preventDefault();
      const v = $('#cd1').value;
      if (confirm) {
        if (v.length < min) return $('#cdErr').textContent = `Au moins ${min} caractères.`;
        if (v !== $('#cd2').value) return $('#cdErr').textContent = 'Les deux mots de passe ne correspondent pas.';
      }
      done(v);
    };
    D.showModal();
  });
}

  else if (t.dataset.prof) { data.profile[t.dataset.prof] = t.value; save(); refreshInvite(); pushProfile(); planifierSynchro(); }
  else if (t.dataset.thera) { data.thera[t.dataset.thera] = t.value; save(); refreshInvite(); pushProfile(); planifierSynchro(); }
  else if (t.id === 'admSearch') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('.urow').forEach(r => r.hidden = !!q && !r.dataset.name.includes(q));
  }
  else if (t.dataset.label) { data.labels[t.dataset.label] = t.value.trim() || DEF_LABELS[t.dataset.label]; save(); }
  else if (t.id === 'autolock') setAutolock(t);
});
document.addEventListener('change', e => {
  if (!data) return;
  if (e.target.id === 'txtFile') {
    const f = e.target.files[0]; busy = false;
    if (f) f.size > 3e6 ? toast('Fichier trop volumineux (3 Mo au plus).') : f.text().then(analyserTexte);
  }
  else if (e.target.id === 'geoloc') { data.settings.geoloc = e.target.checked; save(); }
  else if (e.target.dataset.partage && !e.target.closest('#ptForm')) {
    const choix = {...data.settings.partage, [e.target.dataset.partage]:e.target.checked};
    if (!partageValide(choix)) { e.target.checked = true; return toast('Gardez au moins les émotions, les synthèses ou les notes.'); }
    data.settings.partage = choix; data.settings.partageChoisi = true; save();
  }
});
$('#entryDlg').addEventListener('click', e => { if (e.target === e.currentTarget && !$('#nText')) e.currentTarget.close(); });   // une note en cours ne se perd pas d'un appui à côté

$('#restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; busy = false; if (!f) return;
  let v;
  try { v = JSON.parse(await f.text()); if (v.app !== 'journal-emotions' || !v.ct || v.type) throw 0; }
  catch { return toast(v?.type === 'envoi' ? 'Ce fichier est un envoi pour un thérapeute, pas une sauvegarde.' : 'Ce fichier n’est pas une sauvegarde du journal.'); }
  const c = await askCode('Restaurer une sauvegarde', {label:'Mot de passe ou code de la sauvegarde', hint:'Entrez le mot de passe (ou le code, pour une sauvegarde faite avant les comptes) utilisé au moment de la sauvegarde.'});
  if (c == null) return;
  try {
    const r = await openVault(v, c);
    if (!confirm('Remplacer les notes actuelles par celles de la sauvegarde ?')) return;
    const account = data.account, role = data.role, indice = data.recupIndice, consentement = data.consentement;   // le compte, son type, son mail et l'accord donné restent ceux d'aujourd'hui
    data = defaults(r.obj); data.account = account; data.role = role; data.consentement = consentement;
    if (indice) data.recupIndice = indice;
    syncIndice();
    if (role === 'therapeute') await ensureKeys();
    await saveNow(); showApp(); toast('Sauvegarde restaurée');
  } catch { toast('Mot de passe incorrect pour cette sauvegarde.'); }
});
$('#importFile').addEventListener('change', e => { busy = false; const f = [...e.target.files]; if (f.length) importerFichiers(f, importTarget); });
/* Thérapeute sur ordinateur : fichiers glissés dans la zone « Fichiers reçus » */
document.addEventListener('dragover', e => { const z = e.target.closest?.('#depot'); if (z) { e.preventDefault(); z.classList.add('survol'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#depot')?.classList.remove('survol'); });
document.addEventListener('drop', e => {
  const z = e.target.closest?.('#depot'); if (!z) return;
  e.preventDefault(); z.classList.remove('survol');
  const f = [...e.dataTransfer.files]; if (f.length) importerFichiers(f, null);
});

/* Lien d'invitation ouvert directement : on le garde pour après le déverrouillage et on l'efface de l'adresse */
{
  const m = location.hash.match(/(?:inv|i)=([A-Za-z0-9_-]+)/);
  if (m) { pendingInv = m[1]; history.replaceState(null, '', location.pathname + location.search); }
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // Une nouvelle version vient de s'installer alors que l'app était déjà pilotée par une ancienne : on le propose.
  const dejaActif = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!dejaActif || $('.maj-banner')) return;
    const b = document.createElement('div');
    b.className = 'banner maj-banner'; b.setAttribute('role', 'status');
    b.innerHTML = '<span>Nouvelle version disponible. Vos notes sont conservées.</span><button class="btn primary" data-act="majApp">Mettre à jour</button>';
    document.body.appendChild(b);
  });
  navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
}
boot();
</script>
