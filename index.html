  openClient: t => openClient(t.dataset.id),
  newClient: () => openClientForm(null),
  editClient: () => openClientForm(src.id),
  saveClient: t => {
    const prenom = $('#cfPrenom').value.trim(), nom = $('#cfNom').value.trim();
    if (!prenom && !nom) return $('#cfErr').textContent = 'Indiquez au moins un prénom ou un nom.';
    let c = data.clients[t.dataset.id];
    if (!c) { const id = 'c' + rid(6); c = data.clients[id] = {id, uid:null, profile:{nom:'', prenom:'', start:''}, contact:{}, note:'', labels:{...DEF_LABELS}, days:{}, envois:[]}; }
    Object.assign(c.profile, {prenom, nom});
    c.contact = {tel:$('#cfTel').value.trim(), email:$('#cfEmail').value.trim()};
    c.note = $('#cfNote').value.trim();
    save(); $('#clientDlg').close(); openClient(c.id);
  },
  backClients: () => { src = null; view = 'clients'; render(); },
  clientCal: () => { view = 'cal'; render(); },
  exportClient: () => {
    const ks = Object.keys(src.days).sort(); if (!ks.length) return toast('Aucune donnée à exporter.');
    const from = src.envois[0]?.from || ks[0], to = lastOf(src.envois)?.to || lastOf(ks);
    const who = `${src.profile.prenom}-${src.profile.nom}`.replace(/[^\p{L}\p{N}-]+/gu, '');
    withBusy(() => download(buildXlsx(from, to), `Motus_${who}_${from}_${to}.xlsx`));
  },
  removeClient: () => {
    if (!confirm(`Supprimer la fiche de ${fullName(src)} et toutes les données reçues ?`)) return;
    delete data.clients[src.id]; src = null; view = 'clients'; save(); render();
  },
  prevDay: () => { cur = addDays(cur, -1); render(); },
  nextDay: () => { if (cur < today()) { cur = addDays(cur, 1); render(); } },
  goToday: () => { cur = today(); render(); },
  openDay: t => { cur = t.dataset.k; view = 'day'; render(); },
  calFilter: t => { calF = t.dataset.f || null; calW = null; render(); },
  calWord: t => { calW = t.dataset.w || null; render(); },
  calMode: t => { calMode = t.dataset.m; render(); },
  xPrevWeek: () => setWeek(-1),
  xNextWeek: () => setWeek(1),
  prevMonth: () => { if (--calM < 0) { calM = 11; calY--; } render(); },
  nextMonth: () => { if (++calM > 11) { calM = 0; calY++; } render(); },
  setColor: t => {
    const d = ensureDay(cur), c = t.dataset.c;
    d.color = d.color === c ? null : c;
    document.querySelectorAll('.colbtn').forEach(b => { const on = b.dataset.c === d.color; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    save();
  },
  newEntry: () => openEntry(null),
  editEntry: t => openEntry(t.dataset.id),
  closeDlg: t => t.closest('dialog').close(),
  newNote: () => openNote(null),
  editNote: t => openNote(t.dataset.id),
  saveNote: () => {
    const text = $('#nText').value.trim(), champs = {text, time:$('#eTime').value || nowTime(), ville:$('#eVille').value.trim(), lieu:$('#eLieu').value.trim()};
    if (!text) return $('#nErr').textContent = 'Écrivez quelque chose avant d’enregistrer.';
    const d = ensureDay(cur); d.notes ||= [];
    const n = d.notes.find(x => x.id === noteId);
    if (n) Object.assign(n, champs); else d.notes.push({id:uid(), ...champs});
    save(); $('#entryDlg').close(); render(); toast('Note enregistrée');
  },
  delNote: () => {
    if (!confirm('Supprimer cette note personnelle ?')) return;
    const d = ensureDay(cur); d.notes = dayNotes(d).filter(x => x.id !== noteId);
    save(); $('#entryDlg').close(); render();
  },
  geoTest: async () => {
    const s = $('#geoTest'); s.textContent = 'Recherche de la ville…';
    try { s.textContent = `Ça fonctionne : ${await trouverVille()}.`; } catch (msg) { s.textContent = msg; }
  },
  pickFam: t => { ed.fam = t.dataset.f; renderPicker(); },
  pickInt: t => { ed.int = t.dataset.i; renderPicker(); },
  toggleEmo: t => {
    const w = t.dataset.w, i = ed.emos.findIndex(x => x.f === ed.fam && x.w === w);
    if (i >= 0) ed.emos.splice(i, 1); else ed.emos.push({f:ed.fam, i:ed.int, w});
    renderPicker();
  },
  unpick: t => { ed.emos.splice(+t.dataset.n, 1); renderPicker(); },
  locate: () => locate(true),
  saveEntry: () => {
    ed.time = $('#eTime').value || nowTime();
    ed.ville = $('#eVille').value.trim();
    ed.lieu = $('#eLieu').value.trim();
    ed.car = $('#eCar').value.trim();
    if (!ed.emos.length) return $('#eErr').textContent = 'Choisissez au moins une émotion.';
    const d = ensureDay(cur), {fam, int, villeTouched, ...entry} = ed;
    if (entry.id) d.entries[d.entries.findIndex(x => x.id === entry.id)] = entry;
    else { entry.id = uid(); d.entries.push(entry); countStat('notes'); }
    save(); $('#entryDlg').close(); render(); toast('Émotion enregistrée');
  },
  delEntry: () => {
    if (!confirm('Supprimer cette note ?')) return;
    const d = ensureDay(cur); d.entries = d.entries.filter(x => x.id !== ed.id);
    save(); $('#entryDlg').close(); render();
  },
  exportXlsx: () => { const x = exportRange(); if (x) withBusy(() => download(buildXlsx(x.from, x.to), x.name)); },
  shareXlsx: () => {
    const x = exportRange(); if (!x) return;
    const file = new File([buildXlsx(x.from, x.to)], x.name, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    withBusy(async () => {
      if (navigator.canShare?.({files:[file]})) { try { await navigator.share({files:[file], title:'Motus'}); } catch {} }
      else download(file, x.name);
    });
  },
  changeCode: async () => {
    if (!session) return toast('Connexion internet nécessaire pour changer de mot de passe.');
    const c = await askCode('Changer mon mot de passe', {confirm:true});
    if (!c) return;
    try { await API.setPassword(c); }
    catch (x) { return toast(x.code === 'faible' ? 'Mot de passe trop simple.' : x.code === 'reseau' ? 'Pas de connexion internet.' : 'Changement impossible pour le moment.'); }
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(c, salt);
    if (data.settings.autolock === -1) await rememberKey().catch(() => {});
    await saveNow(); await ensureSecours(c); toast('Mot de passe modifié');
  },
  lockNow: () => lock(),
  backup: () => sauvegarder(),
  backupLater: () => { data.backupPlusTard = today(); save(); $('.sauvegarde-rappel')?.remove(); },
  majApp: async () => { if (key) await saveNow(); location.reload(); },
  restore: () => { busy = true; $('#restoreFile').value = ''; $('#restoreFile').click(); setTimeout(() => busy = false, 60000); },
  install: () => { if (installEvt) { installEvt.prompt(); installEvt = null; } },
  wipe: async () => {
    if (!confirm('Effacer définitivement toutes vos notes de ce téléphone ?\n\nVotre compte reste actif.')) return;
    if (!await confirmerEffacement()) return;
    const vk = VKEY, sk = secoursKey(data.account.identifiant), ik = indiceKey(data.account.identifiant);
    await lock(); localStorage.removeItem(vk); localStorage.removeItem(sk); localStorage.removeItem(ik);
    toast('Vos notes ont été effacées de ce téléphone');
  },
  addRecovery: async () => {
    if (!session) return toast('Connexion internet nécessaire.');
    const r = await askRecovery();
    if (r) await setRecovery(r.email, r.pw);
  },
  confirmRecovery: () => openRecupCode(),
  adoptLegacy: () => adoptLegacy(),
  deleteLegacy: () => {
    if (!confirm('Supprimer définitivement l’ancien journal de cet appareil ?\n\nSes notes seront perdues.')) return;
    if (!confirm('Dernière confirmation : cette action est irréversible. Continuer ?')) return;
    localStorage.removeItem(LEGACY_VKEY); render(); toast('Ancien journal supprimé');
  },
  /* connexion, inscription */
  goSignup: () => showLock('signup'),
  goLogin: () => showLock('login'),
  forgot: () => showLock('forgot'),
  /* administration */
  goAdmin: () => { src = null; view = 'admin'; render(); },
  admReload: () => { adm = admInit(); render(true); },
  admFiltre: t => { adm.filtre = t.dataset.f; render(true); },
  admOpen: t => { adm.ouvert = adm.ouvert === t.dataset.id ? null : t.dataset.id; render(true); },
  admActif: t => admAction(t.dataset.id,
    u => u.actif ? `Désactiver le compte de ${who(u)} ?\n\nIl ne pourra plus se connecter.` : `Réactiver le compte de ${who(u)} ?`,
    u => API.rpc('admin_activer', {p_id:u.id, p_actif:!u.actif})),
  admType: t => admAction(t.dataset.id,
    u => `Passer ${who(u)} en ${u.role === 'client' ? 'thérapeute' : 'client(e)'} ?\n\nUn nouveau numéro lui sera attribué.`,
    u => API.rpc('admin_type', {p_id:u.id, p_role:u.role === 'client' ? 'therapeute' : 'client'})),
  admSuppr: t => admAction(t.dataset.id,
    u => `Supprimer définitivement le compte de ${who(u)} ?\n\nSon journal reste sur son téléphone, mais il ne pourra plus se connecter.`,
    u => API.rpc('admin_supprimer', {p_id:u.id})),
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act] && !t.disabled) { e.preventDefault(); ACT[t.dataset.act](t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!data) return;
  if (t.id === 'synth') {
    ensureDay(cur).synth = t.value; $('#saved').textContent = '…';
    clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow().then(() => { const s = $('#saved'); if (s) s.textContent = 'Enregistré ✓'; }), 500);
  } else if (t.id === 'eCar') updatePreview();
  else if (t.id === 'eVille') ed.villeTouched = true;
  else if (t.id === 'xFrom' || t.id === 'xTo') $('#' + t.id + 'Wd').textContent = weekday(t.value);
  else if (t.id === 'cliSearch') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('.clientrow').forEach(r => r.hidden = !!q && !r.dataset.name.includes(q));
  }
  else if (t.dataset.prof) { data.profile[t.dataset.prof] = t.value; save(); refreshInvite(); pushProfile(); }
  else if (t.dataset.thera) { data.thera[t.dataset.thera] = t.value; save(); refreshInvite(); pushProfile(); }
  else if (t.id === 'admSearch') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('.urow').forEach(r => r.hidden = !!q && !r.dataset.name.includes(q));
  }
  else if (t.dataset.label) { data.labels[t.dataset.label] = t.value.trim() || DEF_LABELS[t.dataset.label]; save(); }
  else if (t.id === 'autolock') setAutolock(t);
});
document.addEventListener('change', e => { if (e.target.id === 'geoloc' && data) { data.settings.geoloc = e.target.checked; save(); } });
$('#entryDlg').addEventListener('click', e => { if (e.target === e.currentTarget && !$('#nText')) e.currentTarget.close(); });   // une note en cours ne se perd pas d'un appui à côté

$('#restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; busy = false; if (!f) return;
  let v;
  try { v = JSON.parse(await f.text()); if (v.app !== 'journal-emotions' || !v.ct || v.type) throw 0; }
  catch { return toast(v?.type === 'envoi' ? 'Ce fichier est un envoi pour un thérapeute, pas une sauvegarde.' : 'Ce fichier n’est pas une sauvegarde du journal.'); }
  const c = await askCode('Restaurer une sauvegarde', {label:'Mot de passe ou code de la sauvegarde', hint:'Entrez le mot de passe (ou le code, pour une sauvegarde faite avant les comptes) utilisé au moment de la sauvegarde.'});
  if (c == null) return;
  try {
    const r = await openVault(v, c);
    if (!confirm('Remplacer les notes actuelles par celles de la sauvegarde ?')) return;
    const account = data.account, role = data.role;   // le compte et son type restent ceux du serveur
    data = defaults(r.obj); data.account = account; data.role = role;
    if (role === 'therapeute') await ensureKeys();
    await saveNow(); showApp(); toast('Sauvegarde restaurée');
  } catch { toast('Mot de passe incorrect pour cette sauvegarde.'); }
});
$('#importFile').addEventListener('change', e => { busy = false; const f = e.target.files[0]; if (f) importEnvoi(f, importTarget); });

/* Lien d'invitation ouvert directement : on le garde pour après le déverrouillage et on l'efface de l'adresse */
{
  const m = location.hash.match(/inv=([A-Za-z0-9_-]+)/);
  if (m) { pendingInv = m[1]; history.replaceState(null, '', location.pathname + location.search); }
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // Une nouvelle version vient de s'installer alors que l'app était déjà pilotée par une ancienne : on le propose.
  const dejaActif = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!dejaActif || $('.maj-banner')) return;
    const b = document.createElement('div');
    b.className = 'banner maj-banner'; b.setAttribute('role', 'status');
    b.innerHTML = '<span>Nouvelle version disponible. Vos notes sont conservées.</span><button class="btn primary" data-act="majApp">Mettre à jour</button>';
    document.body.appendChild(b);
  });
  navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
}
boot();
</script>
</body>
</html>
